name: osmo_refdb
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.11
  - mafft>=7.5
  - trimal>=1.4
  - hmmer>=3.3
  - orfm>=0.7
  - wgsim
  - diamond>=2.1
  - cd-hit>=4.8
  - prodigal>=2.6
  # gene catalogs for osmotool profile --catalog (run_pipeline.sh catalog):
  # indexing and mapping; needs AVX2 on x86-64, or ARM NEON
  - bwa-mem3
  # classic bwa: the full catalog index (osmotool index-catalog --aligner bwa), which
  # bwa-mem3 cannot hold in memory for a whole gut-gene catalog
  - bwa
  # not exercised by osmo_refdb's own build/benchmark pipeline (that only
  # ever runs `osmotool profile` on reads), but needed to actually run
  # `osmotool annotate` -- e.g. to sanity-check reference-database
  # specificity against known, complete genomes (see the E. coli K-12 test).
  - pip
  - pip:
      - requests
      - pyyaml
      - numpy
      - pandas
      - scikit-learn
      - statsmodels     # BacDive analysis (analyze.py, analyze_extended.py)
      - matplotlib
      - scipy
      # NaCl-max model (bin/nacl_model/, run_pipeline.sh nacl_model)
      - xgboost>=3.1   # older versions misread the saved model's base score
      - biopython
      - insilicoseq

# families.yaml — single source of truth for osmo_refdb gene families.
#
# To add a new gene family, add one entry here and rerun:
#   bash run_pipeline.sh build
# No other files need to change.
#
# Fields:
#   name              short family/gene code, used as the tag in FASTA headers
#                     and as the HMM model name (must be unique)
#   description       free text, used in manifests/reports
#   positive_query     UniProt REST query for the true positive set
#                     (see https://rest.uniprot.org/uniprotkb/search)
#   negative_query    UniProt REST query for a "hard negative" set: a
#                     related-but-distinct protein family that a
#                     poorly-calibrated HMM/DIAMOND search might confuse
#                     with the true positives. Prefer xref:pfam-PFxxxxx
#                     queries (verified via https://www.ebi.ac.uk/interpro/api/entry/pfam/PFxxxxx)
#                     over free-text "family:" queries, which UniProt's API
#                     silently returns zero hits for.
#   negative_pfam     Pfam accession used in negative_query, for documentation
#   scope             optional; "annotate_only" excludes a family from
#                     `osmotool profile`'s reported output while still
#                     building/searching it (e.g. murB, a housekeeping gene
#                     with no read-level osmoadaptation signal). Omit for a
#                     normal family available in both modes.
#   decoy_from_negatives  optional bool; when true, that family's own
#                     (QC'd) negative set is added to the DIAMOND reference
#                     db under a "<family>_decoy" label, excluded from
#                     reported output in both modes, purely so
#                     select_best_hits' existing best-alignment contest can
#                     win a read/protein away from the real family when it
#                     actually belongs to a known confusable paralog (e.g.
#                     betL vs betT/caiT) -- see 08a_build_decoy_refs.py.
#                     Only meaningful for a family whose negative_query
#                     targets specific named paralogs, not a broad Pfam
#                     pool (a broad pool makes a weak, noisy decoy).
#   trim_gt           optional float, default 0.8; per-family override for
#                     trimAl's -gt (gap threshold) in 04_align_trim.sh.
#                     Lower values keep more variable/flanking alignment
#                     columns -- useful to test for families whose true
#                     discriminating signal might sit outside the most
#                     conserved core (see ectA/ectB below).
#   max_negative_override  optional int; per-family override for
#                     01_fetch_refs.py's --max-negative cap (default 1000),
#                     same mechanism as max_positive_override but for the
#                     negative fetch. Only meaningful paired with
#                     negative_median_override below -- fixing the median
#                     alone doesn't help if the small capped sample barely
#                     contains anything near the true center.
#   negative_median_override  optional int (aa); use this fixed value as
#                     the negative set's median length in
#                     01c_check_length_outliers.py instead of computing it
#                     from whatever the (capped) negative fetch contains
#                     this run. Only for a family whose median is confirmed
#                     UNSTABLE under the default cap -- established via a
#                     one-off larger fetch, not derived automatically.
#                     Confirmed via a full-panel sweep (2026-07-29) to be
#                     needed only for mazG so far -- see that entry.
#   refseq_gene_symbols  optional list of gene symbols; when set,
#                     01e_add_refseq_positives.py additionally pulls NCBI
#                     RefSeq bacterial proteins tagged with any of these gene
#                     names and merges them into the positive pool, for
#                     families whose UniProt population is already fully
#                     exhausted (fetched count == UniProt's own total, no
#                     cap left to raise) but where RefSeq's independently-
#                     annotated population turned out to add real,
#                     non-redundant, correctly-annotated sequences --
#                     confirmed per-family via a CD-HIT-2D novelty check
#                     plus a manual product-description spot-check before
#                     enabling (see docs/CHANGELOG.md). NOT safe to enable
#                     blindly: a bare gene symbol can collide with a
#                     completely unrelated gene in a different organism --
#                     confirmed for mrpB/mrpC/mrpF during evaluation (e.g.
#                     "MrpC" is also a Proteus fimbrial usher gene and a
#                     Myxococcus CRP/FNR transcription factor) -- so this is
#                     opt-in per family, not a general mechanism. Note:
#                     08_build_diamond_db.sh excludes these merged sequences
#                     (and 01d's _study ones) from the DIAMOND reference
#                     specifically, even though HMM's alignment keeps them --
#                     see that script's header comment.

families:
  - name: ectA
    description: >
      L-2,4-diaminobutyric acid acetyltransferase (ectoine synthesis step 1).
      Also includes ectA1/ectA2 (real, reviewed numbered-paralog gene
      symbols, same class of gap as murB1/murB2 -- see issue #8).

      Full 43-family v7 rebuild shows a real HMM regression here (F1
      0.735->0.701) not visible in any smaller subset test -- consistent
      with the numbered-paralog sweep's broader finding that a full-panel
      build can shift a family's result even when that family's own query
      didn't change much, because the combined HMM/DIAMOND db's
      composition (many more competing reference sequences across the
      whole panel) changes too. Not investigated further; documented
      rather than chased, same treatment as the other full-panel
      regressions this rebuild surfaced.
    positive_query: "(gene:ectA OR gene:ectA1 OR gene:ectA2) AND taxonomy_id:2"
    negative_query: "xref:pfam-PF00583 NOT (gene:ectA OR gene:ectA1 OR gene:ectA2) AND taxonomy_id:2"
    negative_pfam: PF00583   # GNAT acetyltransferase family
    # Flanking-signal experiment, validated via a benchmarked subset test
    # (v5-trimgt-test): PF00583 is an extremely broad, promiscuous fold
    # shared by thousands of unrelated GNAT-family acetyltransferases, so
    # ectA's true discriminating signal was hypothesized to sit in flanking
    # alignment columns the default trimAl -gt 0.8 trims away. Confirmed:
    # trim_gt 0.8->0.6 raised recall on both methods at unchanged precision
    # (diamond F1 0.773->0.825, hmm F1 0.708->0.734).
    trim_gt: 0.6

  - name: ectB
    description: >
      Diaminobutyric acid aminotransferase (ectoine synthesis step 2). Also
      includes ectB1/ectB2 (real, reviewed numbered-paralog gene symbols,
      same class of gap as murB1/murB2 -- see issue #8).
    positive_query: "(gene:ectB OR gene:ectB1 OR gene:ectB2) AND taxonomy_id:2"
    negative_query: "xref:pfam-PF00202 NOT (gene:ectB OR gene:ectB1 OR gene:ectB2) AND taxonomy_id:2"
    negative_pfam: PF00202   # Aminotransferase class-III
    # Same flanking-signal hypothesis as ectA was tested here too (v5-trimgt-test,
    # trim_gt: 0.6) but DIDN'T hold: DIAMOND got meaningfully worse (F1
    # 0.799->0.757, precision 0.711->0.637) while HMM was ~unchanged. Kept
    # at the 0.8 default (omitted here) -- ectB's promiscuous-domain
    # problem needs a different fix; EC-number-verified positive curation
    # is the next thing to try, not attempted yet.

  - name: ectC
    description: >
      Ectoine synthase (ectoine synthesis step 3). Also includes ectC1/ectC2
      (real, reviewed numbered-paralog gene symbols, same class of gap as
      murB1/murB2 -- see issue #8).
    positive_query: "(gene:ectC OR gene:ectC1 OR gene:ectC2) AND taxonomy_id:2"
    negative_query: "xref:pfam-PF07883 NOT (gene:ectC OR gene:ectC1 OR gene:ectC2) AND taxonomy_id:2"
    negative_pfam: PF07883   # Cupin_2 domain

  - name: betL
    description: >
      Glycine betaine transporter (BCCT family; compatible solute import).
      betL/betP/opuD/betS are independently-named orthologs discovered in
      different organisms (Listeria/Corynebacterium/Bacillus/Sinorhizobium)
      that all specifically import glycine betaine -- treated as one
      positive class here rather than by literal gene symbol, since
      "NOT gene:betL" alone leaves the other three symbols' worth of true
      orthologs sitting in the "negative" set (see cutoff_manifest.tsv:
      betL was the only family whose calibration negatives outscored its
      own positives, and both DIAMOND and HMM collapsed to ~3% precision
      on it in the v1 benchmark). betT/caiT are genuine hard negatives:
      same Pfam fold, but choline- and carnitine-specific respectively, not
      glycine betaine. ectP/lcoP are deliberately excluded from both sets:
      they're broad-specificity BCCT transporters that also carry some
      glycine betaine, so labeling them as clean negatives would repeat
      the same mistake. Also includes numbered-paralog variants of all
      four alias symbols (betL1/betL2/betP1/betP2/betS1/betS2/opuD1/opuD2
      -- 289 UniProt members combined), same class of gap as murB1/murB2
      -- see issue #8.
    positive_query: "(gene:betL OR gene:betL1 OR gene:betL2 OR gene:betP OR gene:betP1 OR gene:betP2 OR gene:opuD OR gene:opuD1 OR gene:opuD2 OR gene:betS OR gene:betS1 OR gene:betS2) AND taxonomy_id:2"
    negative_query: "xref:pfam-PF02028 AND (gene:betT OR gene:caiT) NOT (gene:betL OR gene:betL1 OR gene:betL2 OR gene:betP OR gene:betP1 OR gene:betP2 OR gene:opuD OR gene:opuD1 OR gene:opuD2 OR gene:betS OR gene:betS1 OR gene:betS2 OR gene:ectP OR gene:lcoP) AND taxonomy_id:2"
    negative_pfam: PF02028   # BCCT transporter family
    # v4 calibration proved a single score threshold cannot separate betL
    # from betT/caiT (min_positive_score=87.2 vs max_negative_score=642.1 --
    # near-total overlap). Since negative_query above already targets those
    # two specific named paralogs (not a broad Pfam pool), the QC'd negative
    # set is a ready-made decoy: add it to the DIAMOND db so real betT/caiT
    # hits can win the existing best-alignment contest away from betL,
    # instead of relying on an absolute cutoff the data shows can't work.
    decoy_from_negatives: true

  - name: kdpA
    description: >
      K+-translocating ATPase subunit A (high-affinity K+ uptake). Also
      includes kdpA1/kdpA2 (real, reviewed numbered-paralog gene symbols,
      same class of gap as murB1/murB2 -- see issue #8).
    positive_query: "(gene:kdpA OR gene:kdpA1 OR gene:kdpA2) AND taxonomy_id:2"
    negative_query: "xref:pfam-PF02705 NOT (gene:kdpA OR gene:kdpA1 OR gene:kdpA2) AND taxonomy_id:2"
    negative_pfam: PF02705   # KUP/HAK/KT K+ transporter domain

  - name: nhaA
    description: >
      Na+/H+ antiporter A (Na+ extrusion under osmotic stress). Also
      includes nhaA1/nhaA2 -- the largest numbered-paralog population found
      in this panel's systematic sweep (304/389 UniProt members
      respectively, e.g. Campylobacter jejuni, Mycobacterium spp.,
      Salinispora arenicola), same class of gap as murB1/murB2 -- see issue
      #8. Worth extra attention given nhaA is one of the two original
      Task-1 gap-closing genes.
    positive_query: "(gene:nhaA OR gene:nhaA1 OR gene:nhaA2) AND taxonomy_id:2"
    negative_query: "xref:pfam-PF06450 NOT (gene:nhaA OR gene:nhaA1 OR gene:nhaA2) AND taxonomy_id:2"
    negative_pfam: PF06450   # NhaB, a distinct bacterial Na+/H+ antiporter family

  - name: proX
    description: >
      Glycine betaine/proline betaine ABC transporter substrate-binding
      protein (proU system uptake). Species-specific synonyms (B. subtilis
      opuAC/opuBC/opuCC, binding related solutes) are now genuinely in this
      panel as their own families (2026-07-23, Firmicutes gap-filling —
      see opuAC/opuBC/opuCC below), NOT folded into proX's own positive
      set the way betL/betP/opuD/betS were: unlike that group, opuAC/opuBC/
      opuCC aren't literal orthologs of proX under different names in
      different organisms, they're paralogous substrate-binding proteins
      with distinct (if overlapping) solute specificities within the same
      organism, so treating them as one undifferentiated positive class
      would blur real biology proX/opuAC/opuBC/opuCC's own negative_query
      entries all now explicitly exclude every sibling gene symbol, so
      none of them contaminates another's hard-negative pool — the exact
      failure mode betL's fix addressed, now relevant here too since PF04069
      is shared by four families in this panel instead of one. Still rely
      on the negative-purity QC step (01b) as a backstop for anything this
      hand-maintained exclusion list misses. Also includes proX1/proX2
      (real, reviewed numbered-paralog gene symbols, same class of gap as
      murB1/murB2 -- see issue #8); the other three siblings' numbered
      variants are added below and excluded here too, same as the base
      symbols.

      decoy_from_negatives tried and reverted (tested via a 4-family
      subset build, releases/v-test-phase4): redesigning negative_query to
      target opuAC/opuBC/opuCC specifically as this family's decoy source,
      mirroring betL vs. betT/caiT, catastrophically collapsed DIAMOND
      recall for all four families in this clique instead of improving
      precision (opuBC recall dropped to exactly 0.0; proX/opuAC/opuCC all
      under 0.08). Root-caused, not just reverted: opuBC's own genuine
      positive reads were found scoring best against opuAC_decoy/
      proX_decoy/opuCC_decoy entries rather than opuBC's own (sparse, only
      93 UniProt members) positive references -- unlike betT/caiT, which
      are only superficially score-confusable with betL but genuinely
      distinguishable at the sequence level, proX/opuAC/opuBC/opuCC are
      close enough paralogs of each other that adding them back into the
      searchable pool as decoys lets them systematically outcompete a
      family's own thin reference set. decoy_from_negatives does not
      generalize from betL's 2-negative case to this 4-way clique of
      closely related siblings; reverted to PR #6's cross-exclusion-only
      design below.
    positive_query: "(gene:proX OR gene:proX1 OR gene:proX2) AND taxonomy_id:2"
    negative_query: "xref:pfam-PF04069 NOT (gene:proX OR gene:proX1 OR gene:proX2 OR gene:opuAC OR gene:opuAC1 OR gene:opuAC2 OR gene:opuBC OR gene:opuBC1 OR gene:opuBC2 OR gene:opuCC OR gene:opuCC1 OR gene:opuCC2) AND taxonomy_id:2"
    negative_pfam: PF04069   # OpuAC-like ABC transporter substrate-binding domain
  - name: proP
    description: >
      Proline/glycine betaine MFS transporter (proU system alternative
      uptake route to proVWX/BCCT). Positive set is gene-symbol based
      ("gene:proP"), unaffected by the domain choice below.

      Negative set originally anchored on PF08946 (ProP's own cytoplasmic
      osmosensor domain) specifically to avoid the generic MFS_1/Sugar_tr
      fold's promiscuity (thousands of unrelated transporters -- the same
      problem that sank proV/proW, see bottom of this file). That was the
      right call for avoiding a *modeling* problem (HMM/DIAMOND unable to
      discriminate a shared fold), but PF08946 turned out to only have
      246 UniProt members total -- already exhausted, not a fetch-limit
      issue -- and after negative-purity QC (01b) removed orthologs under
      other symbols, only 10 negatives survived: too few for reliable
      cutoff calibration (see 06_calibrate_cutoffs.py's
      MIN_NEG_FOR_RELIABLE_F1 guard, added after this exact family
      produced a degenerate calibration in production).

      Switched to PF00083 (generic MFS_1/Sugar_tr) for volume instead.
      This reintroduces some promiscuity risk in principle, but for a
      *negative* set specifically (as opposed to the modeling risk that
      ruled it out for proV/proW) that's an acceptable trade: 01b/01c's
      automated purity and length QC already exist precisely to catch and
      strip out anything that turns out to be a hidden proP ortholog or
      fusion protein, so a broader, less "hard" raw pull is fine as long
      as enough survives QC to clear the 30-negative reliability floor.

      Also includes proP1/proP2 (real, reviewed numbered-paralog gene
      symbols, same class of gap as murB1/murB2 -- see issue #8).
    positive_query: "(gene:proP OR gene:proP1 OR gene:proP2) AND taxonomy_id:2"
    negative_query: "xref:pfam-PF00083 NOT (gene:proP OR gene:proP1 OR gene:proP2) AND taxonomy_id:2"
    negative_pfam: PF00083   # Sugar_tr, generic MFS transporter domain

  - name: otsA
    description: >
      Trehalose-6-phosphate synthase (trehalose synthesis step 1;
      compatible solute pathway parallel to ectoine synthesis). Also
      includes otsA1/otsA2 (real, reviewed numbered-paralog gene symbols,
      same class of gap as murB1/murB2 -- see issue #8).

      Negative-pool contamination here (58% flagged) is structural, same
      general root cause as mrpB above (real orthologs/related proteins
      UniProt never assigned a curated symbol to, not a synonym gap), and
      there's no pfam_model fallback to route around it -- profile_cascade
      .tsv's HMM fallback is calibrated against the same contaminated pool,
      so it doesn't rescue DIAMOND precision here (0.543, the lowest of
      this cluster along with mrpC). scope: annotate_only set: still built
      and searchable for osmotool annotate co-occurrence checks, excluded
      from osmotool profile's reported output where 0.543 precision would
      be misleading. See README's "Structural negative-pool contamination"
      section.

      Specific mechanism confirmed (2026-07-29), same bug as mrpA/mrpB's:
      both otsA's and otsB's negative pools are contaminated by genuine
      bifunctional trehalose-phosphate synthase+phosphatase proteins
      (PF00982+PF02358 in one ORF, e.g. Hymenobacter/
      Cryobacterium/Corallococcus entries under bare locus tags, some
      annotated "glucosylglycerol-phosphate synthase" -- a closely related
      bifunctional enzyme with the same two-domain shape) -- confirmed via
      direct UniProt lookup. otsA's and otsB's negative-set median lengths
      are identical (724aa both) precisely because they're contaminated by
      the same population, matching mrpB's confirmed contamination shape
      (majority of the pool, corrupting the median-based length filter's
      own calibration). fusion_partner/fusion_marker_pfam declared below
      route these through the same negative-side domain-evidence pre-filter
      built for mrpA/mrpB (see 01c_check_length_outliers.py) instead of
      treating them as ordinary hard negatives: 180/437 (41%) of otsA's
      negative pool pulled out pre-median, dropping its negative-set
      median from 724aa to 487aa (close to its own positive median,
      473aa).

      Full v8 rebuild confirms this was a genuine win for otsA specifically
      (2026-07-29): DIAMOND F1 0.655->0.700 (precision 0.518->0.576, recall
      essentially unchanged), HMM F1 0.579->0.612. Kept. otsB's own side of
      the same fix was tried too but regressed DIAMOND precision there
      (0.902->0.761) -- reverted for otsB specifically; see that entry.
      Independent per-family result: otsA's own negative pool is unaffected
      by otsB's revert (each family's decontamination runs on its own
      negative_query/fusion_marker_pfam, not the partner's).
    positive_query: "(gene:otsA OR gene:otsA1 OR gene:otsA2) AND taxonomy_id:2"
    negative_query: "xref:pfam-PF00982 NOT (gene:otsA OR gene:otsA1 OR gene:otsA2) AND taxonomy_id:2"
    # RefSeq novelty check: 11,356 RefSeq bacterial proteins vs. 905 in
    # UniProt (fully exhausted). 500-sequence sample: 29.8% (149/500)
    # genuinely novel at 90% identity, 94% correctly annotated
    # "alpha,alpha-trehalose-phosphate synthase (UDP-forming)".
    refseq_gene_symbols: [otsA, otsA1, otsA2]
    scope: annotate_only
    negative_pfam: PF00982   # Glyco_transf_20, GT20/trehalose synthase family
    fusion_partner: otsB
    fusion_marker_pfam: PF02358

  - name: otsB
    description: >
      Trehalose-6-phosphate phosphatase (trehalose synthesis step 2). Also
      includes otsB1/otsB2 (real, reviewed numbered-paralog gene symbols,
      same class of gap as murB1/murB2 -- see issue #8).

      Same bifunctional-fusion negative-pool contamination confirmed on
      otsA above (2026-07-29) also affects this family's own negative pool,
      at a similar scale (~59% of the post-purity pool at n=3000, tight
      700-900aa cluster vs. this family's own ~267aa positive median) --
      see otsA's entry for the confirmed mechanism and evidence.
      fusion_partner/fusion_marker_pfam were declared here too, routing
      these through the same fix built for mrpA/mrpB: 282/474 (59%) of
      otsB's negative pool (at n=1000) pulled out pre-median, dropping its
      negative-set median from 725aa to 263aa -- essentially identical to
      its own positive median (267aa). Median-level fix confirmed working.

      TRIED AND REVERTED for this family specifically (2026-07-29): the
      full v8 rebuild showed the fix made DIAMOND precision meaningfully
      *worse* here, not better (0.902->0.761, F1 0.829->0.773; HMM also
      regressed, 0.839->0.711 precision). Root cause, not just observed:
      08b_calibrate_diamond_cutoffs.py sets its cutoff from the negative
      set's own score distribution -- the removed contamination, despite
      being conceptually wrong as ground truth, was genuinely domain-
      similar to otsB's positives (it IS otsB's own catalytic domain, just
      fused to otsA's), so it forced a strict calibration threshold.
      Stripping it out left only very dissimilar "easy" negatives, which
      don't constrain the cutoff enough -- it drifted permissive and let
      through more false positives from elsewhere in the 43-family DIAMOND
      db (recall actually rose slightly, 0.766->0.785, alongside the
      precision collapse -- the signature of a loosened threshold, not a
      worse reference set). fusion_partner/fusion_marker_pfam removed
      below; back to the original negative_query with no fusion-side
      pre-filter. otsA's own side of this fix (see that entry) is kept --
      it improved there and runs independently of otsB's declaration.
    positive_query: "(gene:otsB OR gene:otsB1 OR gene:otsB2) AND taxonomy_id:2"
    negative_query: "xref:pfam-PF02358 NOT (gene:otsB OR gene:otsB1 OR gene:otsB2) AND taxonomy_id:2"
    # RefSeq novelty check: 38,927 RefSeq bacterial proteins vs. 2,732 in
    # UniProt (fully exhausted). 500-sequence sample: 65.6% (328/500)
    # genuinely novel at 90% identity, 100% correctly annotated
    # "trehalose-phosphatase". Largest novelty rate in the panel.
    refseq_gene_symbols: [otsB, otsB1, otsB2]
    negative_pfam: PF02358   # Trehalose_PPase

  - name: mscL
    description: >
      Large-conductance mechanosensitive channel (emergency osmolyte
      release valve during hypoosmotic downshock). Also includes
      mscL1/mscL2 (real, reviewed numbered-paralog gene symbols, same
      class of gap as murB1/murB2 -- see issue #8).

      Negative-pool contamination here (72%, the highest raw flag rate in
      this panel) is the same structural pattern as mrpB/otsA/gshA/mazG
      above, and profile_cascade.tsv's HMM fallback doesn't rescue it (no
      pfam_model, same reason as otsA/mrpC/gshA). Despite that, DIAMOND
      precision (0.927) is fine in practice -- calibration still found a
      workable separating cutoff -- so no scope change; the highest
      contamination rate in the panel doesn't automatically mean the
      worst outcome. See README's "Structural negative-pool contamination"
      section.
    positive_query: "(gene:mscL OR gene:mscL1 OR gene:mscL2) AND taxonomy_id:2"
    negative_query: "xref:pfam-PF01741 NOT (gene:mscL OR gene:mscL1 OR gene:mscL2) AND taxonomy_id:2"
    # RefSeq novelty check: 56,506 RefSeq bacterial proteins vs. 8,910 in
    # UniProt (fully exhausted). 500-sequence sample: 42.8% (214/500)
    # genuinely novel at 90% identity, 100% correctly annotated
    # "large-conductance mechanosensitive channel protein MscL".
    refseq_gene_symbols: [mscL, mscL1, mscL2]
    negative_pfam: PF01741

  - name: mscS
    description: >
      Small-conductance mechanosensitive channel (hypoosmotic downshock
      protection). PF00924 is broader than PF01741/mscL: many bacteria
      carry several divergent MscS-like paralogs (kefA, mscK, ynaI, ...)
      that aren't necessarily functionally interchangeable with mscS
      itself, so treat this one with the same caution as ectB — check
      the benchmark and cutoff_manifest.tsv status before trusting it.
      Also includes mscS1/mscS2 (real, reviewed numbered-paralog gene
      symbols, same class of gap as murB1/murB2 -- see issue #8).
    positive_query: "(gene:mscS OR gene:mscS1 OR gene:mscS2) AND taxonomy_id:2"
    negative_query: "xref:pfam-PF00924 NOT (gene:mscS OR gene:mscS1 OR gene:mscS2) AND taxonomy_id:2"
    # RefSeq novelty check: 4,535 RefSeq bacterial proteins vs. 1,569 in
    # UniProt (fully exhausted). 500-sequence sample: 26.4% (132/500)
    # genuinely novel at 90% identity, 100% correctly annotated
    # "small-conductance mechanosensitive channel MscS" -- no kefA/mscK/
    # ynaI cross-contamination despite this family's own documented
    # promiscuous-Pfam caution above.
    refseq_gene_symbols: [mscS, mscS1, mscS2]
    negative_pfam: PF00924   # MS_channel, broad MscS-like channel family

  - name: galE
    description: >
      UDP-glucose 4-epimerase. Not a classical osmotic-stress-response
      gene on its own, but UDP-glucose (which galE interconverts with
      UDP-galactose) is the shared precursor for both trehalose synthesis
      (otsA, already in this database) and osmoregulated periplasmic
      glucans, both of which are modulated by osmotic flux. Also one of
      three genes (with mazG and murB) that Culligan et al. 2012 (ISME J
      6:1916-1925) traced a functionally-demonstrated salt-tolerance
      phenotype to, via transposon mutagenesis of a salt-tolerant gut
      metagenomic clone.

      PF01370 (NAD_epimerase/dehydratase) is broad -- it covers many
      different NDP-sugar epimerases/dehydratases across LPS, capsule,
      and exopolysaccharide pathways (e.g. rhamnose biosynthesis's RmlB),
      not just galE. Same shape of risk as ectA/ectB's promiscuous-domain
      problem: check cutoff_manifest.tsv/qc_scorecard.tsv status before
      trusting it, don't assume it behaves like a narrow-domain family.
      Also includes galE1/galE2 (real, reviewed numbered-paralog gene
      symbols, same class of gap as murB1/murB2 -- see issue #8).
    positive_query: "(gene:galE OR gene:galE1 OR gene:galE2) AND taxonomy_id:2"
    negative_query: "xref:pfam-PF01370 NOT (gene:galE OR gene:galE1 OR gene:galE2) AND taxonomy_id:2"
    negative_pfam: PF01370   # NAD_epimerase/dehydratase, broad NDP-sugar enzyme family

  - name: mazG
    description: >
      Nucleoside triphosphate pyrophosphohydrolase ("house-cleaning"
      enzyme, sanitizes non-canonical NTPs before they're incorporated
      into DNA/RNA). Established literature ties mazG specifically to
      oxidative stress response (e.g. mycobacterial dormancy/antibiotic
      tolerance) more than osmotic stress -- included here on the basis
      of Culligan et al. 2012 (ISME J 6:1916-1925), which functionally
      demonstrated (transposon mutagenesis of a salt-tolerant gut
      metagenomic clone) that mazG is one of three genes (with galE and
      murB) required for that clone's salt tolerance phenotype. Treat any
      mazG signal as suggestive of a general stress-response contribution
      rather than confirmed osmotic-stress-specific function. Also includes
      mazG1/mazG2 (real, reviewed numbered-paralog gene symbols, same class
      of gap as murB1/murB2 -- see issue #8).

      Negative-pool contamination here (64%, highest raw flag rate along
      with gshB) is the same structural pattern as mrpB/otsA/gshA/mscL,
      and profile_cascade.tsv's HMM fallback doesn't rescue it (no
      pfam_model, same reason as otsA/mrpC/gshA). DIAMOND precision
      (0.870) is borderline but kept in profile mode rather than scoped
      out, since this family's own description already carries a
      biological-confidence caveat above -- a second, structural caveat on
      top would be redundant. See README's "Structural negative-pool
      contamination" section.

      Also, unlike every other family in this panel (confirmed via a
      systematic sweep, 2026-07-29, of all 38 families whose negative
      fetch hits the default 1000-sequence cap): mazG's own negative-set
      length median is genuinely UNSTABLE under that cap, not just
      contaminated. At the default n=1000 cap, the post-purity negative
      pool's median is 215aa; fetched uncapped at n=3000, it drops to
      116aa -- a real, sample-size-driven effect (every other family's
      median moved by ~2% or less between those two fetch sizes).

      Fixing the median alone isn't enough, though: applying 116aa's window
      directly to the default n=1000 fetch's own (post-purity) 357-sequence
      negative pool left only 5 sequences survivable -- that capped sample
      itself barely contains anything near the true center, since the
      accession-sorted oversample it drew from skewed toward the higher
      end. max_negative_override: 3000 below fixes the actual cause (too
      few samples near the true center, not just the wrong center) by
      pulling the same larger population every build, deterministically
      (01_fetch_refs.py's per-family/per-label RNG seed is fixed) --
      negative_median_override: 116 stays as a pin against that value
      drifting if the underlying UniProt data changes over time.
    positive_query: "(gene:mazG OR gene:mazG1 OR gene:mazG2) AND taxonomy_id:2"
    negative_query: "xref:pfam-PF03819 NOT (gene:mazG OR gene:mazG1 OR gene:mazG2) AND taxonomy_id:2"
    # RefSeq novelty check: 45,441 RefSeq bacterial proteins vs. 5,340 in
    # UniProt (UniProt's own gene-symbol population already fully
    # exhausted -- fetched count == total). 500-sequence sample: 41.0%
    # (205/500) genuinely novel at 90% identity against the existing
    # UniProt+study-merged pool, 100% correctly annotated "nucleoside
    # triphosphate pyrophosphohydrolase". Strongest case in the panel.
    refseq_gene_symbols: [mazG, mazG1, mazG2]
    negative_pfam: PF03819   # MazG family (Pfam name is gene-specific, likely narrower than galE's)
    max_negative_override: 3000
    negative_median_override: 116

  - name: murB
    description: >
      UDP-N-acetylenolpyruvoylglucosamine reductase (peptidoglycan
      biosynthesis). The third gene, with galE and mazG, from the
      functionally-demonstrated salt-tolerance locus in Culligan et al.
      2012 (ISME J 6:1916-1925). murB itself is a near-universal
      housekeeping gene present in essentially all bacteria regardless of
      osmotic status, so its abundance carries no osmoadaptation-specific
      signal in short-read community profiling -- included specifically
      to let `osmotool annotate` check whether all three Culligan loci
      genes co-occur in a given genome, not for `osmotool profile`.
      scope: annotate_only below is what encodes that distinction; see
      08c_write_scope_manifest.py. Also includes murB1/murB2 (some
      organisms, e.g. Bacillus cereus/thuringiensis, Symbiobacterium
      thermophilum, carry two real, reviewed, distinctly-named paralogs
      rather than a single plain "murB") -- confirmed via UniProt (11
      members not already matched by bare gene:murB); a genuine missing-
      positive gap, not a negative-pool issue, found while investigating
      the same class of bug as mrpF/mrpG's PhaF/yufB gap.
    positive_query: "(gene:murB OR gene:murB1 OR gene:murB2) AND taxonomy_id:2"
    negative_query: "xref:pfam-PF01565 NOT (gene:murB OR gene:murB1 OR gene:murB2) AND taxonomy_id:2"
    # RefSeq novelty check: 74,987 RefSeq bacterial proteins vs. 12,332 in
    # UniProt (fully exhausted). 500-sequence sample: 32.8% (164/500)
    # genuinely novel at 90% identity, 100% correctly annotated
    # "UDP-N-acetylmuramate dehydrogenase".
    refseq_gene_symbols: [murB, murB1, murB2]
    # Anchored on PF01565 (FAD_binding_4), the N-terminal domain MurB shares
    # with a broad class of FAD-linked oxidoreductases, not PF02873 (MurB_C,
    # the C-terminal domain) -- PF02873 is close to diagnostic for MurB
    # itself, which starved the negative pool (53 UniProt candidates total,
    # 75% of those flagged by 01b as likely mislabeled true positives).
    # PF01565 has 76,989 bacterial candidates excluding murB/murB1/murB2
    # (confirmed live via UniProt REST, 2026-07-31); every real MurB still
    # carries PF02873 too, so 01b's purity filter still catches true
    # orthologs pulled in under the broader anchor.
    negative_pfam: PF01565   # FAD-binding domain shared with related oxidoreductases (broadened from PF02873 -- see comment above)
    scope: annotate_only


# --- 2026-07-23: Bacillota gap-filling, part 1 -- compatible-solute
# transporters (Task 1a) ------------------------------------------------
#
# Added per the osmo_refdb + osmotool extension spec, Task 1: Bacillota
# (the largest phylum in our dataset) had no phylum-appropriate
# specificity-tier gene -- only the core module (galE/murB/mazG/mscL/
# mscS/kdpA), too conserved across phyla to serve as a salt-tolerance
# marker on its own. opuAA-opuCC (Bacillus subtilis-type glycine
# betaine/carnitine/choline ABC transporters) are the first piece closing
# that gap; the Na+/H+ antiporter half (mrpA-mrpG) follows separately.

  - name: opuAA
    description: >
      ATP-binding subunit of the Firmicutes-type glycine betaine/carnitine/
      choline ABC transporter (Bacillus subtilis OpuA system; Task 1a).
      Domain architecture PF00005 (ABC_tran) + PF00571 (CBS domain pair).
      PF00005 alone is far too broad to anchor a negative set on -- the
      same generic ATP-binding fold used by essentially every bacterial ABC
      transporter, the exact reason proV was deferred below -- so the
      negative pool is anchored on the co-occurring CBS-domain pair
      instead, narrowing it to other CBS-domain-bearing ABC-transporter
      ATPases specifically. Still a moderately broad pool (CBS domains
      appear in many otherwise-unrelated regulatory/transport contexts) --
      check qc_scorecard.tsv/cutoff_manifest.tsv before trusting the HMM
      the way ectA/mscS were flagged. Also includes opuAA1/opuAA2 (real,
      reviewed numbered-paralog gene symbols, same class of gap as
      murB1/murB2 -- see issue #8).
    positive_query: "(gene:opuAA OR gene:opuAA1 OR gene:opuAA2) AND taxonomy_id:2"
    negative_query: "xref:pfam-PF00571 NOT (gene:opuAA OR gene:opuAA1 OR gene:opuAA2 OR gene:opuBA OR gene:opuBA1 OR gene:opuBA2 OR gene:opuCA OR gene:opuCA1 OR gene:opuCA2) AND taxonomy_id:2"
    negative_pfam: PF00571   # CBS domain pair, co-occurring with ABC_tran in this transporter class

  - name: opuBA
    description: >
      ATP-binding subunit of the OpuB system (choline-specific relative of
      OpuA; Task 1a). Same domain architecture and negative-query caveats
      as opuAA above. Also includes opuBA1/opuBA2 (real, reviewed
      numbered-paralog gene symbols, same class of gap as murB1/murB2 --
      see issue #8).
    positive_query: "(gene:opuBA OR gene:opuBA1 OR gene:opuBA2) AND taxonomy_id:2"
    negative_query: "xref:pfam-PF00571 NOT (gene:opuAA OR gene:opuAA1 OR gene:opuAA2 OR gene:opuBA OR gene:opuBA1 OR gene:opuBA2 OR gene:opuCA OR gene:opuCA1 OR gene:opuCA2) AND taxonomy_id:2"
    negative_pfam: PF00571

  - name: opuCA
    description: >
      ATP-binding subunit of the OpuC system (carnitine/choline/betaine
      relative of OpuA; Task 1a). Same domain architecture and
      negative-query caveats as opuAA above. Also includes opuCA1/opuCA2
      (real, reviewed numbered-paralog gene symbols, same class of gap as
      murB1/murB2 -- see issue #8).

      Full 43-family v7 rebuild shows a real HMM regression here (F1
      0.541->0.490) -- same full-panel db-composition effect noted on
      several other families in this rebuild (see ectA's entry).
    positive_query: "(gene:opuCA OR gene:opuCA1 OR gene:opuCA2) AND taxonomy_id:2"
    negative_query: "xref:pfam-PF00571 NOT (gene:opuAA OR gene:opuAA1 OR gene:opuAA2 OR gene:opuBA OR gene:opuBA1 OR gene:opuBA2 OR gene:opuCA OR gene:opuCA1 OR gene:opuCA2) AND taxonomy_id:2"
    negative_pfam: PF00571

  - name: opuAB
    description: >
      Permease subunit of the OpuA system (Task 1a). Single domain PF00528
      (BPD_transp_1) -- the same generic ABC-transporter permease fold
      flagged in the proW deferral below; building this one anyway since
      Task 1a explicitly requests it, but the same promiscuous-domain risk
      applies in full. Expect this family to need the most scrutiny of the
      whole 2026-07-23 batch: check qc_scorecard.tsv/cutoff_manifest.tsv
      first, consider a trim_gt experiment (see ectA), and if HMM detection
      genuinely can't be made reliable here, that's a legitimate outcome --
      fall back to DIAMOND-only / gene-symbol identity for this one rather
      than trusting a poorly-separated HMM cutoff. Also includes
      opuAB1/opuAB2 (real, reviewed numbered-paralog gene symbols, same
      class of gap as murB1/murB2 -- see issue #8).

      Full 43-family v7 rebuild shows a real HMM regression here (F1
      0.830->0.789) -- same full-panel db-composition effect as
      ectA/ktrA/ktrD/mrpB above. Consistent with this family already being
      flagged as needing the most scrutiny in this batch.
    positive_query: "(gene:opuAB OR gene:opuAB1 OR gene:opuAB2) AND taxonomy_id:2"
    negative_query: "xref:pfam-PF00528 NOT (gene:opuAB OR gene:opuAB1 OR gene:opuAB2 OR gene:opuBB OR gene:opuBB1 OR gene:opuBB2 OR gene:opuCB OR gene:opuCB1 OR gene:opuCB2 OR gene:proW) AND taxonomy_id:2"
    negative_pfam: PF00528   # BPD_transp_1, generic ABC transporter permease domain (same fold flagged for proW below)

  - name: opuBB
    description: >
      Permease subunit of the OpuB system (Task 1a). Same domain and
      caveats as opuAB above. Also includes opuBB1/opuBB2 (real, reviewed
      numbered-paralog gene symbols, same class of gap as murB1/murB2 --
      see issue #8).
    positive_query: "(gene:opuBB OR gene:opuBB1 OR gene:opuBB2) AND taxonomy_id:2"
    negative_query: "xref:pfam-PF00528 NOT (gene:opuAB OR gene:opuAB1 OR gene:opuAB2 OR gene:opuBB OR gene:opuBB1 OR gene:opuBB2 OR gene:opuCB OR gene:opuCB1 OR gene:opuCB2 OR gene:proW) AND taxonomy_id:2"
    negative_pfam: PF00528

  - name: opuCB
    description: >
      Permease subunit of the OpuC system (Task 1a). Same domain and
      caveats as opuAB above. Also includes opuCB1/opuCB2 (real, reviewed
      numbered-paralog gene symbols, same class of gap as murB1/murB2 --
      see issue #8).

      Full 43-family v7 rebuild shows a real regression on both methods
      here (DIAMOND F1 0.557->0.500, HMM F1 0.377->0.334) -- the only
      family in this rebuild flagged on both methods at once, same
      full-panel db-composition effect as opuAB above but larger and on
      both sides here. Consistent with this family already carrying the
      same "needs the most scrutiny" caution as opuAB.
    positive_query: "(gene:opuCB OR gene:opuCB1 OR gene:opuCB2) AND taxonomy_id:2"
    negative_query: "xref:pfam-PF00528 NOT (gene:opuAB OR gene:opuAB1 OR gene:opuAB2 OR gene:opuBB OR gene:opuBB1 OR gene:opuBB2 OR gene:opuCB OR gene:opuCB1 OR gene:opuCB2 OR gene:proW) AND taxonomy_id:2"
    negative_pfam: PF00528

  - name: opuAC
    description: >
      Substrate-binding subunit of the OpuA system (Task 1a). Same Pfam
      family (PF04069) as proX, already in this panel -- proX/opuAC/opuBC/
      opuCC are genuine, distinct paralogs with different (if overlapping)
      solute specificities within the same organism, not literal orthologs
      of one another the way betL/betP/opuD/betS are, so they're kept as
      four separate gene-symbol-anchored families, each excluding all three
      siblings' gene symbols from its own negative pool (see proX's entry
      above for the matching fix). Deliberately NOT given pfam_model
      treatment despite PF04069 being a reasonably narrow, well-curated
      Pfam family (not a broad multi-substrate fold on its own terms):
      Pfam draws its boundary one level broader than what we need here --
      "solute-binding protein of this structural class" -- so adopting
      Pfam's single model+cutoff would make proX/opuAC/opuBC/opuCC
      indistinguishable from each other, defeating the point of separating
      them. This is exactly the "check condition 2" case flagged in this
      section's header comment. Also includes opuAC1/opuAC2 (real,
      reviewed numbered-paralog gene symbols, same class of gap as
      murB1/murB2 -- see issue #8).

      decoy_from_negatives tried and reverted -- see proX's entry above
      for the mechanism (catastrophic DIAMOND recall collapse, tested via
      a 4-family subset build). This family's own reads were among the
      ones swamped by decoy entries from its siblings.
    positive_query: "(gene:opuAC OR gene:opuAC1 OR gene:opuAC2) AND taxonomy_id:2"
    negative_query: "xref:pfam-PF04069 NOT (gene:proX OR gene:proX1 OR gene:proX2 OR gene:opuAC OR gene:opuAC1 OR gene:opuAC2 OR gene:opuBC OR gene:opuBC1 OR gene:opuBC2 OR gene:opuCC OR gene:opuCC1 OR gene:opuCC2) AND taxonomy_id:2"
    negative_pfam: PF04069

  - name: opuBC
    description: >
      Substrate-binding subunit of the OpuB system (Task 1a). Same Pfam
      family and caveats as opuAC above. Also includes opuBC1/opuBC2
      (real, reviewed numbered-paralog gene symbols, same class of gap as
      murB1/murB2 -- see issue #8).

      decoy_from_negatives tried and reverted -- see proX's entry above
      for the mechanism (catastrophic DIAMOND recall collapse, tested via
      a 4-family subset build). This family in particular was the worst
      hit: its own real positive reads (240 test reads, only 93 UniProt
      members to begin with) scored zero true positives, with every
      aligned read attributed to a sibling's decoy label instead --
      opuBC's thin reference set couldn't compete once the other three
      siblings' sequences were added back into the searchable pool.
    positive_query: "(gene:opuBC OR gene:opuBC1 OR gene:opuBC2) AND taxonomy_id:2"
    negative_query: "xref:pfam-PF04069 NOT (gene:proX OR gene:proX1 OR gene:proX2 OR gene:opuAC OR gene:opuAC1 OR gene:opuAC2 OR gene:opuBC OR gene:opuBC1 OR gene:opuBC2 OR gene:opuCC OR gene:opuCC1 OR gene:opuCC2) AND taxonomy_id:2"
    negative_pfam: PF04069

  - name: opuCC
    description: >
      Substrate-binding subunit of the OpuC system (Task 1a). Same Pfam
      family and caveats as opuAC above. Also includes opuCC1/opuCC2
      (real, reviewed numbered-paralog gene symbols, same class of gap as
      murB1/murB2 -- see issue #8).

      decoy_from_negatives tried and reverted -- see proX's entry above
      for the mechanism (catastrophic DIAMOND recall collapse, tested via
      a 4-family subset build).
    positive_query: "(gene:opuCC OR gene:opuCC1 OR gene:opuCC2) AND taxonomy_id:2"
    negative_query: "xref:pfam-PF04069 NOT (gene:proX OR gene:proX1 OR gene:proX2 OR gene:opuAC OR gene:opuAC1 OR gene:opuAC2 OR gene:opuBC OR gene:opuBC1 OR gene:opuBC2 OR gene:opuCC OR gene:opuCC1 OR gene:opuCC2) AND taxonomy_id:2"
    negative_pfam: PF04069

  # opuD (Task 1a) is NOT added as its own family: it's already one of
  # betL's synonym orthologs (see betL's positive_query above, "gene:betL
  # OR gene:betP OR gene:opuD OR gene:betS"), which predates this batch.
  # Adding a second, separate opuD family here would create two
  # conflicting reference/HMM targets for the same protein.

# --- 2026-07-23: Bacillota gap-filling, part 2 -- Mrp/Mnh Na+/H+
# antiporter complex (Task 1b) -------------------------------------------
#
# nhaA is functionally absent outside Pseudomonadota/some Actinomycetota --
# Bacillota uses the unrelated, multi-subunit Mrp/Mnh complex instead, so
# nhaA alone reports a false "antiporter absent" signal for most
# Firmicutes. mrpA-mrpG fixes this specifically.
#
# Two new families.yaml fields introduced here:
#
#   pfam_model: PFxxxxx   Use that Pfam family's own curated HMM (built from
#                         Pfam's hand-curated seed alignment, carrying its
#                         own GA/TC/NC lines) directly, instead of
#                         hmmbuild-ing a fresh model from our own fetched-
#                         and-aligned UniProt sequences -- see
#                         05_build_hmms.sh and 06_calibrate_cutoffs.py.
#                         Checked per gene, not assumed for the whole panel
#                         (per-gene InterPro API check: domain_architectures
#                         count and Pfam's own family description/name --
#                         low architecture count + a name that matches the
#                         gene one-to-one is a real Pfam family, not a broad
#                         multi-substrate fold).
#   fusion_partner: name  Declares this family's gene product occurs as a
#                         single fused ORF with the named partner family in
#                         some lineages (only mrpA/mrpB here -- see mrpA's
#                         entry below for the taxonomic evidence). See
#                         01_fetch_refs.py, 01c_check_length_outliers.py, and
#                         08d_build_fusion_refs.py for the mechanism.
#   fusion_marker_pfam: PFxxxxx  Paired with fusion_partner: a Pfam domain
#                         that, when found in an over-length candidate from
#                         EITHER partner's raw fetch, confirms a genuine
#                         fusion rather than an unrelated length outlier.

  - name: mrpA
    description: >
      Subunit A of the Firmicutes-type Mrp/Mnh Na+/H+ antiporter complex
      (Task 1b; fills the nhaA false-negative gap for Bacillota -- see this
      section's header). mrpA and mnhA are literal synonyms for the same
      gene product (Mrp = "multiple resistance and pH adaptation"; Mnh =
      the same complex under an alternate naming convention used in
      different lineages) -- confirmed via matching Pfam domain
      architecture (PF13244+PF20501+PF00361+PF00662) across both symbol
      sets, so both are folded into one positive class, the same synonym
      treatment betL/betP/opuD/betS already use elsewhere in this panel.
      NOT pfam_model-adopted: none of the four component Pfam domains is
      specific to Mrp/Mnh alone -- PF13244 in particular ("MBH, subunit D")
      is shared with the structurally related but functionally distinct
      membrane-bound-hydrogenase (MBH) complex, and PF00361 is shared with
      ordinary Complex I NuoL/M/N-type subunits -- so no single Pfam
      family's own GA cutoff would be gene-specific enough here; kept as a
      custom model built from the full four-domain architecture instead.

      fusion_partner/fusion_marker_pfam: mrpA and mrpB can occur as a
      single fused ORF (e.g. Corynebacterium jeikeium Q4JSN9, 1079aa,
      PF13244+PF20501+PF04039+PF00361+PF00662 in one ORF under the gene
      symbol "mnhB"), confirmed via direct UniProt search -- 109 >900aa
      PF13244-carrying hits within Bacillota alone (taxonomy_id:1239),
      concentrated in Paenibacillaceae (Paenibacillus, Saccharibacillus,
      Cohnella -- e.g. A0A919Y2M6, gene symbol literally "mrpA", 957aa,
      Paenibacillus apis), plus further confirmed examples in
      Actinomycetota and Alphaproteobacteria (Rhizobium/Sinorhizobium,
      Sulfitobacter, Thioclava, Shimia). Genus Bacillus itself
      (taxonomy_id:1386, B. subtilis's own genus) shows zero fused hits --
      it always keeps mrpA/mrpB split. This fusion is taxonomically
      dispersed and varies even WITHIN Bacillota at the family level
      (Paenibacillaceae vs. Bacillaceae) -- it doesn't track any single
      clean phylum boundary, which is why this mechanism detects it from
      the ORF's own domain/length signature (see
      01c_check_length_outliers.py, 08d_build_fusion_refs.py) rather than
      from a taxonomic rule. mrpD has no fusion_partner set -- no evidence
      of an mrpD fusion turned up in any search run. Also includes
      mrpA1/mrpA2/mnhA1/mnhA2 (real, reviewed numbered-paralog gene
      symbols, same class of gap as murB1/murB2 -- see issue #8).

      Same bare-locus-tag fused-ORF contamination confirmed on mrpB's
      negative pool (see mrpB's entry below, 2026-07-29) also affects this
      family's own negative pool, though far more mildly (48/936, ~5%, vs.
      mrpB's ~68%) -- expected, since PF00361 (this family's negative
      anchor) is a broad domain diluted across many unrelated proteins,
      unlike PF04039 which mrpB's negative pool is anchored on directly.
      Same fix applies (01c_check_length_outliers.py's negative-side
      domain-evidence pre-filter) and, unlike mrpB's own case, is KEPT
      here: full v8 rebuild shows this family's own numbers are essentially
      flat (DIAMOND F1 0.714->0.701, precision 0.625->0.634, a small recall
      trade-off) rather than the sharp regression seen on mrpB -- consistent
      with mrpA's much smaller (~5%) contamination fraction giving the
      DIAMOND calibration less to lose. mrpB's own side of this fix was
      reverted (see that entry) for regressing precision there; mrpA's own
      negative-side decontamination is independent of mrpB's declaration
      and unaffected by that revert.
    positive_query: "(gene:mrpA OR gene:mrpA1 OR gene:mrpA2 OR gene:mnhA OR gene:mnhA1 OR gene:mnhA2) AND taxonomy_id:2"
    negative_query: "xref:pfam-PF00361 NOT (gene:mrpA OR gene:mrpA1 OR gene:mrpA2 OR gene:mnhA OR gene:mnhA1 OR gene:mnhA2 OR gene:mrpD OR gene:mrpD1 OR gene:mrpD2 OR gene:mnhD OR gene:mnhD1 OR gene:mnhD2) AND taxonomy_id:2"
    negative_pfam: PF00361   # shared with mrpD's own architecture and with generic Complex I NuoL/M/N-type subunits
    fusion_partner: mrpB
    fusion_marker_pfam: PF13244

  - name: mrpB
    description: >
      Subunit B of the Mrp/Mnh complex (Task 1b). mrpB/mnhB synonym pair,
      same reasoning as mrpA above. PF04039 ("MnhB" in Pfam's own naming)
      checked individually via the InterPro API: 18 domain architectures
      across 11107 proteins, name matches the gene one-to-one -- adopted
      via pfam_model, retiring custom empirical calibration for the HMM
      path (DIAMOND references still come from our own UniProt fetch as
      normal).

      fusion_partner/fusion_marker_pfam: mrpA is this family's confirmed
      fused-ORF partner -- see mrpA's entry above for the taxonomic
      evidence (Bacillota/Paenibacillaceae, Actinomycetota, some
      Alphaproteobacteria; not universal even within Bacillota -- Bacillus
      itself keeps them split). A raw mrpB/mnhB positive fetch pulls in
      these same fused ~950-1100aa sequences (many literally
      gene-symbol-annotated "mrpA", since the fused ORF's dominant/
      N-terminal domain is mrpA's); with fusion_partner declared here, 01c
      routes them to fusion_candidates.faa instead of the ordinary
      length-outlier pile, and 08d_build_fusion_refs.py merges them into a
      searchable mrpA_mrpB_fused DIAMOND reference. Also includes
      mrpB1/mrpB2/mnhB1/mnhB2 (real, reviewed numbered-paralog gene
      symbols, same class of gap as murB1/murB2 -- see issue #8).

      Negative-pool contamination here (23% flagged) is structural, not a
      synonym gap: flagged sequences are real Mrp/Mnh orthologs UniProt
      never assigned a curated gene symbol to, confirmed via direct
      sequence check -- not fixable by widening positive_query (disproven
      on trkA, see that entry) or raising max_negative_override (disproven
      on mrpF/mrpG). This is exactly the case pfam_model exists to route
      around: cutoff_manifest.tsv shows hmm_status=pfam_ga_review_needed,
      meaning the HMM path already defers to Pfam's own GA cutoff instead
      of a locally-calibrated one, so the domain-architecture screening
      that justified pfam_model here turns out to be the right call for a
      second, independent reason. See README's "Structural negative-pool
      contamination" section for the full analysis.

      Full 43-family v7 rebuild shows the largest single regression in
      this rebuild: DIAMOND F1 0.673->0.587. Notably DIAMOND-only -- HMM
      is essentially unaffected (0.214->0.219), consistent with the
      pfam_model vindication above: the HMM path already doesn't rely on
      this repo's own calibration, so it isn't exposed to whatever shifted
      in the full-panel DIAMOND db's composition. Same full-panel
      db-composition effect as ectA/ktrA/ktrD above, just larger in
      magnitude here.

      Root cause since found (2026-07-29): mrpB's negative pool was ~68%
      contaminated with genuine mrpA+mrpB fused-ORF sequences under bare
      locus tags (e.g. "Lokhon_03054" in Thioclava/Sulfitobacter/
      Rubellimicrobium -- the same genera mrpA's own fusion evidence names
      above), confirmed via direct UniProt lookup (same PF13244+PF20501+
      PF04039+PF00361+PF00662 architecture as the confirmed fusion cases).
      These match this family's own negative_query (they carry PF04039,
      the domain the query is anchored on) but not its gene-symbol
      exclusion (no mrpB/mnhB/mrpA/mnhA symbol at all), so they were never
      caught -- not by the query, not by 01b's purity check (apparently
      below its 70% identity threshold), and not by 01c's positive-side
      fusion detection (which only ever looked at the positive fetch).
      Being the majority of the pool, they became this family's own
      "normal" negative-set median (937-944aa -- confirmed stable whether
      the negative fetch was capped at 1000 or pulled uncapped at ~9800,
      i.e. not a small-sample sampling artifact), which caused
      01c_check_length_outliers.py's median-based length filter to discard
      the true ~140aa hard negatives as outliers instead of the
      contamination. Fixed by extending fusion-candidate detection to the
      negative fetch too, using domain evidence alone (pre-median, since
      length is exactly what the contamination breaks) -- see that
      script's module docstring and 01_fetch_refs.py's negative-side
      domain-evidence fetch. Median-level fix confirmed working: mrpB's
      negative-set median dropped from 937aa to 161aa (close to its own
      positive median, 141aa) once the 543/774 contaminating sequences were
      pulled out.

      TRIED AND REVERTED for this family specifically (2026-07-29): the
      full v8 rebuild showed the fix made DIAMOND precision collapse, not
      recover -- 0.888->0.187, F1 0.587->0.272 (recall actually rose
      slightly, 0.438->0.498, the signature of a threshold that got more
      permissive, not a worse reference set). Root cause, not just
      observed: 08b_calibrate_diamond_cutoffs.py sets its cutoff from the
      negative set's own score distribution. The removed contamination,
      despite being conceptually wrong as ground truth, was genuinely
      domain-similar to mrpB's positives (real PF04039 content, just fused
      to mrpA's), so it forced a strict calibration threshold; stripping it
      out left only very dissimilar "easy" negatives that don't constrain
      the cutoff enough, letting it drift permissive and admit more false
      positives from elsewhere in the 43-family DIAMOND db. Same mechanism
      independently confirmed on otsB (see that entry) with a milder
      version of the same regression.

      fusion_partner/fusion_marker_pfam removed below -- back to the
      original negative_query with no negative-side pre-filter or query-
      time exclusion. Side effect, accepted: this also disables mrpB's own
      positive-side oversized-candidate check (the code ties both to the
      same declaration), so a fusion candidate ONLY discoverable via
      mrpB/mnhB's own gene-tagged positive fetch (not also tagged mrpA/
      mnhA) would no longer be routed to mrpA_mrpB_fused.faa from this
      side -- mrpA's own positive-side check (unaffected, see that entry)
      still catches candidates found via its own fetch, and many fused
      entries carry both gene-symbol tags on the same UniProt record
      anyway per the documented examples above, so the practical coverage
      loss is expected to be small. mrpA's own negative-side decontamination
      is unaffected by this revert -- it runs off mrpA's own declaration,
      not mrpB's, and is kept (see mrpA's entry).
    positive_query: "(gene:mrpB OR gene:mrpB1 OR gene:mrpB2 OR gene:mnhB OR gene:mnhB1 OR gene:mnhB2) AND taxonomy_id:2"
    negative_query: "xref:pfam-PF04039 NOT (gene:mrpB OR gene:mrpB1 OR gene:mrpB2 OR gene:mnhB OR gene:mnhB1 OR gene:mnhB2) AND taxonomy_id:2"
    negative_pfam: PF04039
    pfam_model: PF04039

  - name: mrpC
    description: >
      Subunit C of the Mrp/Mnh complex (Task 1b). mrpC/mnhC synonym pair.
      PF00420 ("Oxidored_q2") checked and rejected for pfam_model: broad
      (66 domain architectures, 33257 proteins), shared with the unrelated
      nuoK/ndhK Complex I subunit-4L family well beyond Mrp/Mnh -- kept as
      a custom gene-symbol-anchored model, same caution tier as ectB/mscS/
      galE elsewhere in this panel; check qc_scorecard.tsv before trusting.
      Also includes mrpC1/mrpC2/mnhC1/mnhC2 (real, reviewed
      numbered-paralog gene symbols, same class of gap as murB1/murB2 --
      see issue #8).

      Negative-pool contamination here (26% flagged) is structural, same
      root cause as mrpB above (real orthologs UniProt never assigned a
      curated symbol to, not a synonym gap) but with no pfam_model
      fallback to route around it -- DIAMOND precision here (0.479) has no
      independent rescue mechanism either, since profile_cascade.tsv's HMM
      fallback is calibrated against the same contaminated pool. Worse
      precision than otsA (0.543), which got the same treatment for this
      exact reason -- scope: annotate_only set here too: still built and
      searchable for osmotool annotate co-occurrence checks, excluded from
      osmotool profile's reported output. See README's "Structural
      negative-pool contamination" section.
    positive_query: "(gene:mrpC OR gene:mrpC1 OR gene:mrpC2 OR gene:mnhC OR gene:mnhC1 OR gene:mnhC2) AND taxonomy_id:2"
    negative_query: "xref:pfam-PF00420 NOT (gene:mrpC OR gene:mrpC1 OR gene:mrpC2 OR gene:mnhC OR gene:mnhC1 OR gene:mnhC2) AND taxonomy_id:2"
    negative_pfam: PF00420   # Oxidored_q2, broad Complex-I-type subunit 4L family, also covers nuoK/ndhK
    scope: annotate_only

  - name: mrpD
    description: >
      Subunit D of the Mrp/Mnh complex (Task 1b). mrpD/mnhD synonym pair.
      Single domain PF00361, but that domain is itself broad (shared with
      generic Complex I NuoL/M/N-type subunits, and with mrpA's own
      architecture -- hence excluding mrpA/mnhA symbols from this family's
      negative pool too) -- kept custom, not pfam_model-adopted. No
      fusion_partner set: the confirmed fused-ORF pair in this complex is
      mrpA+mrpB (see those entries above); no evidence turned up of mrpD
      participating in a fusion with anything. Also includes
      mrpD1/mrpD2/mnhD1/mnhD2 (real, reviewed numbered-paralog gene
      symbols, same class of gap as murB1/murB2 -- see issue #8).
    positive_query: "(gene:mrpD OR gene:mrpD1 OR gene:mrpD2 OR gene:mnhD OR gene:mnhD1 OR gene:mnhD2) AND taxonomy_id:2"
    negative_query: "xref:pfam-PF00361 NOT (gene:mrpD OR gene:mrpD1 OR gene:mrpD2 OR gene:mnhD OR gene:mnhD1 OR gene:mnhD2 OR gene:mrpA OR gene:mrpA1 OR gene:mrpA2 OR gene:mnhA OR gene:mnhA1 OR gene:mnhA2) AND taxonomy_id:2"
    negative_pfam: PF00361

  - name: mrpE
    description: >
      Subunit E of the Mrp/Mnh complex (Task 1b). mrpE/mnhE synonym pair.
      PF01899 ("MNHE" in Pfam's own naming) checked: 9 domain
      architectures, 10745 proteins, name matches directly -- adopted via
      pfam_model. Also includes mrpE1/mrpE2/mnhE1/mnhE2 (real, reviewed
      numbered-paralog gene symbols, same class of gap as murB1/murB2 --
      see issue #8).

      Negative-pool contamination here (21% flagged) is structural, same
      root cause as mrpB/mrpC above. Same vindication as mrpB:
      cutoff_manifest.tsv shows hmm_status=pfam_ga_review_needed, meaning
      the HMM path already defers to Pfam's own GA cutoff rather than a
      locally-calibrated one, so the domain-architecture screening that
      justified pfam_model here is validated for a second, independent
      reason. See README's "Structural negative-pool contamination"
      section.
    positive_query: "(gene:mrpE OR gene:mrpE1 OR gene:mrpE2 OR gene:mnhE OR gene:mnhE1 OR gene:mnhE2) AND taxonomy_id:2"
    negative_query: "xref:pfam-PF01899 NOT (gene:mrpE OR gene:mrpE1 OR gene:mrpE2 OR gene:mnhE OR gene:mnhE1 OR gene:mnhE2) AND taxonomy_id:2"
    negative_pfam: PF01899
    pfam_model: PF01899

  - name: mrpF
    description: >
      Subunit F of the Mrp/Mnh complex (Task 1b). mrpF/mnhF/PhaF synonym
      trio (Pfam documents PhaF as a third alias, from yet another
      organism's nomenclature for this same protein). PF04066
      ("MrpF_PhaF") checked: 9 domain architectures, name matches
      directly -- adopted via pfam_model. The PhaF alias was documented
      here from the start but NOT originally carried into either query --
      a real bug, confirmed via the v6 QC scorecard (42% neg_purity
      contamination) and directly verified: 142 PhaF-gene-tagged, real
      PF04066-carrying UniProt entries were sitting in the "negative" pool
      because the query only excluded mrpF/mnhF. Fixing it gave a real,
      confirmed benchmark improvement (DIAMOND F1 0.244->0.329, HMM F1
      0.193->0.250) but only a partial one -- checking the entries still
      flagged after the fix shows this family shares mrpG's structural
      problem too (see mrpG's entry below): most of what's left in the
      "negative" pool are real orthologs UniProt never assigned a curated
      gene symbol to (bare locus tags), which no synonym addition can
      catch. neg_purity barely moved (42%->46%) because PhaF was only one
      of several contamination sources, not the dominant one. Also
      includes mrpF1/mrpF2/mnhF1/mnhF2/PhaF1/PhaF2 (real, reviewed
      numbered-paralog gene symbols, same class of gap as murB1/murB2 --
      see issue #8).
    positive_query: "(gene:mrpF OR gene:mrpF1 OR gene:mrpF2 OR gene:mnhF OR gene:mnhF1 OR gene:mnhF2 OR gene:PhaF OR gene:PhaF1 OR gene:PhaF2) AND taxonomy_id:2"
    negative_query: "xref:pfam-PF04066 NOT (gene:mrpF OR gene:mrpF1 OR gene:mrpF2 OR gene:mnhF OR gene:mnhF1 OR gene:mnhF2 OR gene:PhaF OR gene:PhaF1 OR gene:PhaF2) AND taxonomy_id:2"
    negative_pfam: PF04066
    pfam_model: PF04066

  - name: mrpG
    description: >
      Subunit G of the Mrp/Mnh complex (Task 1b). mrpG/mnhG/yufB synonym
      trio (Pfam documents yufB, B. subtilis's own locus-tag-derived
      alias, as a third name for the same family). PF03334
      ("PhaG_MnhG_YufB") checked: 12 domain architectures, name matches --
      adopted via pfam_model. yufB was documented here from the start but
      NOT originally carried into either query, the same gap mrpF/PhaF
      had -- added for consistency/completeness, but verified this does
      NOT explain mrpG's own 59% neg_purity contamination the way PhaF
      explains mrpF's: every yufB-tagged PF03334 UniProt entry already
      also carries the mrpG gene name on the same record (so gene:mrpG
      alone already matched it), and the actual flagged "negative"
      entries checked directly carry no informative gene symbol at all
      (bare locus tags) -- real orthologs UniProt never assigned a
      curated name to, which no alias addition could catch. mrpG's
      negative-pool contamination looks structural: PF03334 apparently
      has few members that are genuinely distinct from mrpG/mnhG itself,
      not a missing-synonym problem. Worth a separate look if this
      family's calibration keeps flagging poorly after this fix. Also
      includes mrpG1/mrpG2/mnhG1/mnhG2 (real, reviewed numbered-paralog
      gene symbols, same class of gap as murB1/murB2 -- see issue #8;
      yufB1/yufB2 checked with zero UniProt hits, not added).
    positive_query: "(gene:mrpG OR gene:mrpG1 OR gene:mrpG2 OR gene:mnhG OR gene:mnhG1 OR gene:mnhG2 OR gene:yufB) AND taxonomy_id:2"
    negative_query: "xref:pfam-PF03334 NOT (gene:mrpG OR gene:mrpG1 OR gene:mrpG2 OR gene:mnhG OR gene:mnhG1 OR gene:mnhG2 OR gene:yufB) AND taxonomy_id:2"
    # RefSeq novelty check: 21,148 RefSeq bacterial proteins vs. 1,672 in
    # UniProt (fully exhausted). 500-sequence sample: 76.6% (383/500)
    # genuinely novel at 90% identity, 99.5% correctly annotated
    # "monovalent cation/H(+) antiporter subunit G". NOT extended to
    # mrpB/mrpC/mrpF siblings -- their equivalent gene symbols collide
    # with unrelated genes in other organisms (see field doc above).
    refseq_gene_symbols: [mrpG, mrpG1, mrpG2, mnhG, mnhG1, mnhG2, yufB]
    negative_pfam: PF03334
    pfam_model: PF03334

# --- 2026-07-23: Gut-validated osmotic-stress subsystems (Task 1c) -------
#
# Ng et al. 2023 (mBio), in vivo humanized-mouse osmotic-perturbation data --
# a functionally demonstrated evidentiary tier, the same as the Culligan et
# al. 2012 loci (galE/mazG/murB) already in this panel, and a step up from
# genomic-co-occurrence-only support.

  - name: betA
    description: >
      Choline dehydrogenase (choline -> glycine betaine oxidation, step 1
      of 2 with betB; Task 1c). Basis: Ng et al. 2023 (mBio), in vivo
      humanized-mouse osmotic-perturbation data. Domain pair
      PF05199+PF00732 (GMC oxidoreductase family) is broad -- shared with
      glucose oxidase and other choline/alcohol oxidoreductases --
      checked and rejected for pfam_model, kept custom. Confirmed present
      in Bacillota directly (e.g. Staphylococcus aureus UniProt entries
      carry it), consistent with this being a genuinely Firmicutes-relevant
      gut subsystem per Ng et al. Also includes betA1/betA2 (real, reviewed
      numbered-paralog gene symbols, same class of gap as murB1/murB2 --
      see issue #8).
    positive_query: "(gene:betA OR gene:betA1 OR gene:betA2) AND taxonomy_id:2"
    negative_query: "xref:pfam-PF00732 NOT (gene:betA OR gene:betA1 OR gene:betA2) AND taxonomy_id:2"
    negative_pfam: PF00732   # GMC_oxred_C, broad GMC oxidoreductase family (glucose oxidase, other choline/alcohol oxidoreductases)

  - name: betB
    description: >
      Betaine aldehyde dehydrogenase (choline -> glycine betaine oxidation,
      step 2 of 2 with betA; Task 1c). Same Ng et al. 2023 in vivo basis as
      betA above. PF00171 (Aldedh) is the SAME broad generic
      aldehyde-dehydrogenase-superfamily domain already flagged in the
      gbsA deferral below -- gbsA was deferred specifically because of this
      domain's promiscuity. betB is built anyway (explicitly requested,
      with in vivo validation behind it) but carries the identical risk;
      treat with at least as much caution as ectB/mscS -- check
      qc_scorecard.tsv/cutoff_manifest.tsv before trusting the HMM, and
      don't take betB's inclusion as evidence that gbsA is now safe to add
      by the same reasoning. Also includes betB1/betB2 (real, reviewed
      numbered-paralog gene symbols, same class of gap as murB1/murB2 --
      see issue #8).
    positive_query: "(gene:betB OR gene:betB1 OR gene:betB2) AND taxonomy_id:2"
    negative_query: "xref:pfam-PF00171 NOT (gene:betB OR gene:betB1 OR gene:betB2) AND taxonomy_id:2"
    negative_pfam: PF00171   # Aldedh, broad aldehyde dehydrogenase superfamily (same domain flagged for gbsA below)

  - name: gshA
    description: >
      Glutamate-cysteine ligase (glutathione biosynthesis step 1 of 2, with
      gshB; Task 1c). PF04262 ("Glu_cys_ligase") checked: 19 domain
      architectures, 4430 proteins -- tight and specific in isolation, BUT
      see gshF below: several Firmicutes genera (Streptococcus,
      Enterococcus, Listeria and relatives) use a single bifunctional
      gshF/gshAB enzyme that carries this same PF04262 catalytic domain,
      so PF04262 is no longer gshA-exclusive within this panel -- the same
      "condition 2" situation as opuAC/opuBC/opuCC vs. proX and
      trkH/ktrB/ktrD (see families.yaml header comment and README). NOT
      pfam_model-adopted for that reason: Pfam's own PF04262 GA cutoff is
      trained across the whole family, gshF included, so using it directly
      risks calling gshF proteins as gshA. Negative pool now also excludes
      gshF/gshAB gene symbols, for the same reason proX's negative_query
      was updated when opuAC/opuBC/opuCC were added. Also includes
      gshA1/gshA2/gshAB1/gshAB2 (real, reviewed numbered-paralog gene
      symbols, same class of gap as murB1/murB2 -- see issue #8; gshF1/
      gshF2 checked with zero UniProt hits, not added).

      Negative-pool contamination here (25% flagged) is the same
      structural pattern as mrpB/otsA/mazG/mscL (real orthologs UniProt
      never assigned a curated symbol to), and profile_cascade.tsv's HMM
      fallback doesn't rescue it either (no pfam_model here, same reason
      as mrpC/otsA). Unlike otsA/mrpC, though, DIAMOND precision (0.905)
      is fine in practice -- calibration still found a workable separating
      cutoff despite the noisy pool -- so no scope change. See README's
      "Structural negative-pool contamination" section.
    positive_query: "(gene:gshA OR gene:gshA1 OR gene:gshA2) AND taxonomy_id:2"
    negative_query: "xref:pfam-PF04262 NOT (gene:gshA OR gene:gshA1 OR gene:gshA2 OR gene:gshF OR gene:gshAB OR gene:gshAB1 OR gene:gshAB2) AND taxonomy_id:2"
    negative_pfam: PF04262

  - name: gshF
    description: >
      Bifunctional glutamate-cysteine ligase/glutathione synthetase (Task
      1c gap-fill, added after reviewing gshA/gshB's coverage): several
      Firmicutes genera -- Streptococcus, Enterococcus, Listeria,
      Clostridium and relatives, all common gut taxa -- use this single
      gshF/gshAB enzyme instead of separate gshA+gshB genes. Confirmed via
      UniProt this is NOT a literal fusion of gshA's and gshB's own
      domains the way mrpA+mrpB is (see those entries): gshF carries
      gshA's exact catalytic domain (PF04262) but, for the synthetase
      half, a DIFFERENT domain (PF18419, "ATP-grasp_6") rather than gshB's
      own (PF02951/PF02955) -- confirmed no gshF-annotated UniProt entry
      in a real sample carried PF02951. So this is a genuinely distinct,
      third enzyme family that happens to cover both activities in one
      ORF, not a domain-level concatenation of the other two genes --
      the fusion_partner mechanism (built for mrpA/mrpB, which IS a real
      domain concatenation) doesn't mechanically fit here, and forcing it
      would be wrong, not just extra work. Modeled as an ordinary family
      instead, which fully covers the real gap: without it, Streptococcus/
      Enterococcus/Listeria genomes would show a false "no glutathione
      biosynthesis" signal despite having a fully functional pathway --
      consequential specifically because gshA/gshB were pitched as this
      panel's strongest evidence-tier genes (Ng et al. 2023 in vivo
      validation), and those are exactly the gut genera that matter most
      for that claim. NOT pfam_model-adopted: PF18419 alone hasn't been
      checked closely enough to trust as gshF-specific on its own (unlike
      PF04262, it isn't independently paired with a confirmed-narrow
      partner domain the way e.g. mrpE/mrpF/mrpG were verified) -- kept
      custom out of caution rather than assumed safe. Also includes
      gshAB1/gshAB2 (real, reviewed numbered-paralog gene symbols, same
      class of gap as murB1/murB2 -- see issue #8; gshF1/gshF2 checked
      with zero UniProt hits, not added).

      Different situation from gshA/gshB/mrpB above: gshF's own
      negative-pool purity is actually reasonably clean (only ~8% flagged,
      well below the rest of this cluster), so this isn't the same
      bare-locus-tag contamination pattern. Its moderate DIAMOND precision
      (0.654) instead reflects a genuinely small, hard-to-calibrate
      training set for a family this taxonomically narrow (Streptococcus/
      Enterococcus/Listeria and relatives specifically) -- profile_cascade
      .tsv's HMM fallback doesn't rescue it either (no pfam_model here,
      same reason as gshA). No scope change: this family exists
      specifically to avoid a false "no glutathione biosynthesis" signal
      in exactly the gut genera gshA/gshB's evidence-tier claim rests on
      (see this family's main description above), so excluding it from
      profile mode would defeat its own purpose.
    positive_query: "(gene:gshF OR gene:gshAB OR gene:gshAB1 OR gene:gshAB2) AND taxonomy_id:2"
    negative_query: "xref:pfam-PF04262 NOT (gene:gshA OR gene:gshA1 OR gene:gshA2 OR gene:gshF OR gene:gshAB OR gene:gshAB1 OR gene:gshAB2) AND taxonomy_id:2"
    negative_pfam: PF04262

  - name: gshB
    description: >
      Glutathione synthetase (glutathione biosynthesis step 2 of 2, with
      gshA; Task 1c). Anchored on PF02951 (GSH-S_N, the substrate-binding
      domain specific to this enzyme) rather than the broader PF02955
      ATP-grasp fold it's paired with in the full protein (shared by many
      unrelated ATP-grasp enzymes) -- same "prefer the narrower co-occurring
      domain over the broad catalytic fold" choice proP already makes
      elsewhere in this panel (PF08946 vs. generic MFS_1). 10 domain
      architectures, 7964 proteins -- adopted via pfam_model. Also includes
      gshB1/gshB2 (real, reviewed numbered-paralog gene symbols, same class
      of gap as murB1/murB2 -- see issue #8).

      Negative-pool contamination here is the worst in this panel (63%
      flagged) but structural, same root cause as mrpB above. Same
      vindication: cutoff_manifest.tsv shows
      hmm_status=pfam_ga_review_needed, meaning the HMM path already
      defers to Pfam's own GA cutoff rather than a locally-calibrated one
      that this contaminated pool couldn't have produced reliably anyway
      -- the domain-architecture screening that justified pfam_model here
      is validated for a second, independent reason, and matters more here
      than anywhere else in this panel given gshA/gshB are pitched as this
      panel's strongest evidence-tier genes (Ng et al. 2023 in vivo
      validation). See README's "Structural negative-pool contamination"
      section.
    positive_query: "(gene:gshB OR gene:gshB1 OR gene:gshB2) AND taxonomy_id:2"
    negative_query: "xref:pfam-PF02951 NOT (gene:gshB OR gene:gshB1 OR gene:gshB2) AND taxonomy_id:2"
    # RefSeq novelty check: 34,172 RefSeq bacterial proteins vs. 3,579 in
    # UniProt (fully exhausted). 500-sequence sample: 18.4% (92/500)
    # genuinely novel at 90% identity, 100% correctly annotated
    # "glutathione synthase".
    refseq_gene_symbols: [gshB, gshB1, gshB2]
    negative_pfam: PF02951   # GSH-S_N, glutathione-synthetase-specific substrate-binding domain (not the generic PF02955 ATP-grasp fold)
    pfam_model: PF02951

  - name: gor
    description: >
      Glutathione reductase (closes the gamma-glutamyl/glutathione redox
      cycle with gshA/gshB; Task 1c). PF07992 (Pyr_redox_2) is broad --
      shared with thioredoxin reductase (trxB) and other FAD-dependent
      pyridine-nucleotide disulfide oxidoreductases -- rejected for
      pfam_model. Negative set anchored on trxB specifically (a real,
      functionally close, same-fold paralog gene symbol) rather than the
      raw broad Pfam pool, the same "named confusable paralog" approach
      betL uses. If calibration shows the same near-total score overlap
      betL had (see cutoff_manifest.tsv), revisit decoy_from_negatives here
      too -- not set yet, no calibration data to justify it until the first
      build runs. Also includes gor1/gor2 (real, reviewed numbered-paralog
      gene symbols, same class of gap as murB1/murB2 -- see issue #8).
    positive_query: "(gene:gor OR gene:gor1 OR gene:gor2) AND taxonomy_id:2"
    negative_query: "xref:pfam-PF07992 AND gene:trxB NOT (gene:gor OR gene:gor1 OR gene:gor2) AND taxonomy_id:2"
    negative_pfam: PF07992   # Pyr_redox_2, broad FAD-disulfide oxidoreductase family; negative set narrowed to the trxB paralog specifically

  - name: cspA
    description: >
      Cold-shock domain family (Task 1c: "cspA-family cold shock proteins
      -- use a curated Pfam cold-shock domain model; expect multiple
      paralogs per genome -- capture all matches, do not dedupe to one per
      genome at the refdb stage"). positive_query is deliberately anchored
      on the Pfam accession itself (xref:pfam-PF00313), NOT a single gene
      symbol -- the only family in this panel built this way -- so it
      captures every csp paralog (cspA through cspI-type genes and
      organism-specific equivalents), not just literally-"cspA"-named
      orthologs. This structurally satisfies "capture all matches, don't
      dedupe": every paralog is its own independent UniProt entry / DIAMOND
      reference / HMM hit, and nothing in this repo's build collapses
      them -- if per-genome deduplication happens anywhere, it would be in
      osmotool's annotate/profile output (Task 2, a separate repo), not
      here, so there is nothing to disable in this repo either way.
      pfam_model: PF00313 adopted directly (Pfam's own long-established CSD
      gathering cutoff). max_positive_override caps the fetch at 5000 --
      PF00313 has roughly 80,000 UniProt member proteins total, and
      fetching/clustering/aligning all of them would be disproportionate;
      capped safely here since the HMM path doesn't use our alignment at
      all (pfam_model) and DIAMOND reference diversity plateaus well before
      80k largely-redundant paralogs. Negative set anchored on PF00436
      (SSB, single-stranded DNA-binding protein) -- a related-but-distinct
      OB-fold family, not a literal confusable paralog the way betL/gor's
      negatives are, just the closest well-curated "different function,
      similar fold" Pfam family available.
    positive_query: "xref:pfam-PF00313 AND taxonomy_id:2"
    negative_query: "xref:pfam-PF00436 NOT xref:pfam-PF00313 AND taxonomy_id:2"
    negative_pfam: PF00436   # SSB, single-stranded DNA-binding protein (related OB-fold, functionally distinct)
    pfam_model: PF00313
    max_positive_override: 5000

  - name: trkA
    description: >
      Regulatory/NAD-binding subunit of constitutive K+ uptake (Trk system;
      Task 1d, "Kdp backup/disambiguation" -- an alternative K+ uptake
      route to the inducible Kdp system already in this panel via kdpA,
      useful for telling "no Kdp signal" apart from "no K+ uptake
      capability at all"). Proteobacteria-type naming (E. coli TrkA).

      Kept as its own family, separate from ktrA below, the same way
      nhaA and mrpA-mrpG are two separate families for the same Na+/H+
      antiporter function rather than one merged entry -- trkA/trkH
      (this entry + trkH below, Proteobacteria naming) and ktrA/ktrB/ktrD
      (Firmicutes naming, new entries below) are the same split pattern.
      IMPORTANT naming trap that motivated adding ktrA/ktrB/ktrD at all:
      the literal gene symbol "trkA" in Bacillota mostly does NOT refer to
      this system -- B. subtilis's own "trkA" (UniProt O07085) is an
      unrelated CBS-domain protein (PF13738); the real Firmicutes-lineage
      ortholog of E. coli TrkA (matching PF02080+PF02254) is consistently
      named ktrA instead (confirmed via B. subtilis, B. licheniformis, and
      several Clostridium/Staphylococcus/Enterococcus UniProt entries) --
      the same Proteobacteria-named-gene-assumed-universal pattern as
      nhaA. (The same bare-symbol trap showed up while researching
      opuB/opuC: neither resolves to the intended Bacillus-type
      transporter operon in UniProt, which is why this panel uses the
      real per-subunit symbols opuAB/opuBB/opuCB etc. instead -- see
      those entries above.) PF02080 (TrkA_N) rejected for pfam_model: a
      broad RCK-domain family, shared across many unrelated K+/Ca2+
      channel regulatory subunits. Negative pool excludes both trkA and
      ktrA gene symbols even though they're separate families, for the
      same reason proX/opuAC/opuBC/opuCC cross-exclude each other: ktrA
      is a real, distinct true positive elsewhere in this panel, not a
      clean negative for trkA. Also includes trkA1/trkA2 (some organisms,
      e.g. Azoarcus sp. BH72, Streptococcus thermophilus, carry two real,
      distinctly-named paralogs) -- confirmed via UniProt, the same
      numbered-paralog gap found for murB1/murB2 and trkH1/ktrB1/ktrD1
      below while investigating the class of bug mrpF/mrpG's PhaF/yufB
      gap belongs to. Adding trkA1/trkA2 has a measured cost: of 372
      UniProt trkA1/trkA2 entries, 82% (median 223aa) are short
      single-RCK-domain proteins already excluded by the length-outlier
      filter (canonical trkA median 457aa), but the 68 that pass the
      filter are real, taxonomically scattered full-length orthologs
      (e.g. Halomonas, Cupriavidus, Roseobacter, Fusobacterium,
      Ruminococcus) whose diversity widens the DIAMOND reference cloud
      and measurably increases false positives on a held-out benchmark
      (6-family subset-test F1 0.920->0.879; confirmed in the full
      43-family v7 rebuild at 0.920->0.887, same regression, close to but
      not identical to the subset-test number -- see the "full 43-family
      v7 rebuild" notes on ectA/ktrA/mrpB/etc. for why full-panel and
      subset-test numbers for the same family don't always match exactly).
      Kept anyway: these are real trkA genes a genuine read could come
      from, not an artifact, so this is a recall-vs-specificity trade-off
      structurally like the negative-pool findings below, not a bug to
      chase further.
    positive_query: "(gene:trkA OR gene:trkA1 OR gene:trkA2) AND taxonomy_id:2"
    negative_query: "xref:pfam-PF02080 NOT (gene:trkA OR gene:trkA1 OR gene:trkA2 OR gene:ktrA OR gene:ktrA1 OR gene:ktrA2) AND taxonomy_id:2"
    # RefSeq novelty check: 24,815 RefSeq bacterial proteins vs. 4,858 in
    # UniProt (fully exhausted). 500-sequence sample: 25.2% (126/500)
    # genuinely novel at 90% identity, 100% correctly annotated "Trk
    # system potassium transporter TrkA".
    refseq_gene_symbols: [trkA, trkA1, trkA2]
    negative_pfam: PF02080   # TrkA_N, broad RCK-domain regulatory-subunit family

  - name: trkH
    description: >
      Pore-forming subunit of the Trk system, paired with trkA above (Task
      1d). Proteobacteria-type naming (E. coli TrkH); see trkA's entry
      above for why this is kept separate from ktrB/ktrD (Firmicutes
      naming, below) rather than merged as synonyms, matching the nhaA/mrp
      treatment. PF02386 ("TrkH") is shared by all three of trkH/ktrB/ktrD
      as real, distinct true positives in this panel -- the same situation
      as proX vs. opuAC/opuBC/opuCC, and NOT given pfam_model treatment for
      the same reason: adopting Pfam's one model+cutoff for more than one
      of a same-Pfam-family sibling group makes their HMMs byte-identical,
      which isn't just a specificity concern the way it is for proX/opuAC
      -- confirmed via the v6 benchmark that it's a hard failure for HMM
      detection specifically. All three sibling HMMs score exactly the
      same on any given read (same underlying model), so hmmscan can't
      tell them apart at all; 07_press_hmms.sh concatenates hmms/*.hmm in
      alphabetical order and 11_compute_metrics.py's best_hit_per_read
      keeps the first tied hit, so whichever of the three sorts first
      alphabetically wins 100% of the shared signal and the other two get
      systematically zero HMM recall -- observed directly: trkH and ktrD
      both scored exactly 0 true positives in the v6 HMM benchmark, all
      of it absorbed by ktrB. DIAMOND is unaffected (it discriminates via
      each family's own distinct reference sequences, not the shared
      profile) -- trkH/ktrB/ktrD all get real, distinct DIAMOND numbers.
      Kept as a custom, gene-symbol-anchored model instead, same as
      proX/opuAC/opuBC/opuCC. Also includes trkH1/trkH2 (some organisms,
      e.g. Edwardsiella tarda, Azoarcus sp. BH72, carry two real,
      distinctly-named paralogs) -- confirmed via UniProt, same
      numbered-paralog gap as murB1/murB2/trkA1/trkA2/ktrB1/ktrD1 etc.

      Same structural negative-pool contamination as mrpB/otsA/etc. (see
      README's "Structural negative-pool contamination" section):
      confirmed via v7's negative_purity_manifest.tsv that the
      numbered-paralog fix above barely moved this family's contamination
      (v6 27% flagged -> v7 29%), consistent with the pattern being real
      unlabeled orthologs, not a missing-symbol gap. decoy_from_negatives
      is not a fix either: Phase 4's proX/opuAC/opuBC/opuCC experiment
      (see issue tracker / docs/CHANGELOG.md) showed this exact
      shared-Pfam-clique shape (trkH/ktrB/ktrD share PF02386 the same way
      proX/opuAC/opuBC/opuCC share PF04069) catastrophically backfires --
      close paralogs outcompete a family's own reference set once added
      back into the searchable pool as decoys. No pfam_model fallback is
      possible here either (removing pfam_model from all three was the
      fix for the byte-identical-HMM bug above), so both DIAMOND (0.293)
      and HMM (0.288) precision are low with no independent rescue via
      profile_cascade.tsv (hmm_status=overlapping_distributions_f1_calibrated,
      same contaminated pool). scope: annotate_only set, same criteria and
      treatment as otsA/mrpC: still built and searchable for osmotool
      annotate co-occurrence checks, excluded from osmotool profile's
      reported output where this precision would be misleading.
    positive_query: "(gene:trkH OR gene:trkH1 OR gene:trkH2) AND taxonomy_id:2"
    negative_query: "xref:pfam-PF02386 NOT (gene:trkH OR gene:trkH1 OR gene:trkH2 OR gene:ktrB OR gene:ktrB1 OR gene:ktrB2 OR gene:ktrD OR gene:ktrD1 OR gene:ktrD2) AND taxonomy_id:2"
    negative_pfam: PF02386   # TrkH cation transport family
    scope: annotate_only

  - name: ktrA
    description: >
      Regulatory/NAD-binding subunit of constitutive K+ uptake (Ktr system
      -- the Firmicutes-named counterpart to trkA above; Task 1d, and the
      actual Bacillota-relevant half of this gap-fill -- see trkA's entry
      above for the full naming-trap explanation and why this is its own
      family rather than a trkA synonym, matching nhaA/mrp's treatment).
      Same domain pair (PF02080+PF02254) as trkA; PF02080 rejected for
      pfam_model for the same broad-RCK-domain reason as trkA. Also
      includes ktrA1/ktrA2 (some organisms, e.g. Halobacillus karajensis,
      Clostridium scindens, carry two real, distinctly-named paralogs) --
      confirmed via UniProt, same numbered-paralog gap as trkA1/trkA2.

      Full 43-family v7 rebuild shows a real DIAMOND regression here (F1
      0.838->0.785) not predicted by the earlier 6-family subset test
      (which showed this family roughly flat) -- a full-panel build
      changes the combined DIAMOND db's composition beyond what a small
      subset test can capture. Not investigated further; documented
      rather than chased.
    positive_query: "(gene:ktrA OR gene:ktrA1 OR gene:ktrA2) AND taxonomy_id:2"
    negative_query: "xref:pfam-PF02080 NOT (gene:trkA OR gene:trkA1 OR gene:trkA2 OR gene:ktrA OR gene:ktrA1 OR gene:ktrA2) AND taxonomy_id:2"
    negative_pfam: PF02080

  - name: ktrB
    description: >
      Pore-forming subunit of the Ktr system, paired with ktrA above (Task
      1d) -- the Firmicutes-named counterpart to trkH. B. subtilis carries
      two paralogous pore-forming subunits, ktrB and ktrD (both PF02386,
      confirmed via UniProt) -- kept as two separate families (this entry
      and ktrD below) rather than merged as synonyms, the same treatment
      this panel already gives other same-organism paralog pairs (e.g.
      proX vs. opuAC/opuBC/opuCC, mscL vs. mscS) rather than cross-organism
      orthologs (betL/betP/opuD/betS, mrpA/mnhA). NOT given pfam_model
      treatment: see trkH's entry above for why PF02386, shared by all
      three of trkH/ktrB/ktrD, breaks HMM detection specifically when more
      than one sibling adopts it (byte-identical models, so hmmscan can't
      discriminate them -- confirmed via the v6 benchmark). Kept custom.
      Also includes ktrB1/ktrB2 (some organisms, e.g. Paenibacillus larvae,
      Nonomuraea coxensis, carry two real, distinctly-named paralogs) --
      confirmed via UniProt, same numbered-paralog gap as trkH1/trkH2.

      Same structural negative-pool contamination and same disposition as
      trkH above (v6 14.5% flagged -> v7 15.5%, barely moved by the
      numbered-paralog fix; decoy_from_negatives ruled out by Phase 4's
      finding on the same PF02386 clique shape; no pfam_model fallback
      possible; DIAMOND 0.265/HMM 0.247 precision, neither rescued by
      profile_cascade.tsv). scope: annotate_only set, same criteria as
      otsA/mrpC/trkH.
    positive_query: "(gene:ktrB OR gene:ktrB1 OR gene:ktrB2) AND taxonomy_id:2"
    negative_query: "xref:pfam-PF02386 NOT (gene:trkH OR gene:trkH1 OR gene:trkH2 OR gene:ktrB OR gene:ktrB1 OR gene:ktrB2 OR gene:ktrD OR gene:ktrD1 OR gene:ktrD2) AND taxonomy_id:2"
    negative_pfam: PF02386
    scope: annotate_only

  - name: ktrD
    description: >
      Second paralogous pore-forming subunit of the Ktr system, alongside
      ktrB above (Task 1d) -- see ktrB's entry for why these two are kept
      as separate families rather than merged as synonyms, and trkH's
      entry for why none of trkH/ktrB/ktrD get pfam_model treatment
      despite sharing PF02386. Also includes ktrD1/ktrD2 (some organisms,
      e.g. Peribacillus simplex, Salinibacillus aidingensis, Bacillus
      carboniphilus, carry two real, distinctly-named paralogs) --
      confirmed via UniProt, same numbered-paralog gap as ktrB1/ktrB2.

      Full 43-family v7 rebuild shows a real HMM regression here (F1
      0.245->0.214) -- same full-panel db-composition effect noted on
      ectA/ktrA above. Given ktrD's already-tiny reference set (54 UniProt
      positives), treat this specific number with extra caution regardless
      of direction -- small-n reliability risk applies here the same way
      it does to gshB/murB elsewhere in this panel.

      Same structural negative-pool contamination and same disposition as
      trkH/ktrB above (2.4% -> 2.8% flagged, barely moved by the
      numbered-paralog fix; decoy_from_negatives ruled out by Phase 4's
      finding; no pfam_model fallback possible). HMM precision here is the
      worst in this cluster (0.121, with very high recall 0.904 -- calling
      almost everything positive, consistent with the small-n calibration
      risk already noted above), DIAMOND 0.287, neither rescued by
      profile_cascade.tsv. scope: annotate_only set, same criteria as
      otsA/mrpC/trkH/ktrB.
    positive_query: "(gene:ktrD OR gene:ktrD1 OR gene:ktrD2) AND taxonomy_id:2"
    negative_query: "xref:pfam-PF02386 NOT (gene:trkH OR gene:trkH1 OR gene:trkH2 OR gene:ktrB OR gene:ktrB1 OR gene:ktrB2 OR gene:ktrD OR gene:ktrD1 OR gene:ktrD2) AND taxonomy_id:2"
    negative_pfam: PF02386
    scope: annotate_only

# Considered and deferred (2026-07-16): proV, proW, gbsA, gbsB
#
# Requested alongside proX/proP/gbsAB, but skipped for now because their
# Pfam domains are shared by huge numbers of functionally unrelated
# bacterial proteins, which would make both HMM and DIAMOND detection
# unreliable at the single-domain level (worse than the ectB case):
#   proV  PF00005 (ABC_tran)   — generic ATP-binding domain, used by
#                                 essentially every bacterial ABC transporter
#   proW  PF00528 (BPD_transp_1) — generic ABC transporter permease domain
#   gbsA  PF00171 (Aldedh)     — generic aldehyde dehydrogenase superfamily
#   gbsB  PF00465 (Fe-ADH)     — generic iron-containing alcohol
#                                 dehydrogenase superfamily
# (all four accessions verified via live UniProt entries: P14175/P14176/
# P71016/P71017)
#
# If these are revisited, don't use xref:pfam-PFxxxxx for the negative
# set as-is (it'll return a huge, mostly uninformative pool) — either
# hand-pick a small set of functionally-distinct negatives, or accept
# that proV/proW/gbsA/gbsB can only be called at low confidence and scope
# the tool's output accordingly.

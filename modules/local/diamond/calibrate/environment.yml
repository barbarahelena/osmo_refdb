# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/environment-schema.json
# Image: Seqera diamond_numpy_python_pyyaml (exists; versions read from the image). DIAMOND_CALIBRATE uses its python, numpy and pyyaml
channels:
  - conda-forge
  - bioconda
dependencies:

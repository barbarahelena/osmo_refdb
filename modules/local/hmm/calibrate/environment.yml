---
# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/environment-schema.json
# Image: Seqera cd-hit_hmmer_trimal_mafft_pruned (exists; versions read from the image). HMM_CALIBRATE uses its hmmer, python, numpy and pyyaml
channels:
  - conda-forge
  - bioconda
dependencies:
  - bioconda::hmmer=3.4
  - bioconda::mafft=7.526
  - bioconda::trimal=1.5.1
  - bioconda::cd-hit=4.8.1
  - conda-forge::python=3.11.0
  - conda-forge::numpy=2.4.6
  - conda-forge::pyyaml=6.0.3
  - conda-forge::requests=2.34.2
  - conda-forge::procps-ng=4.0.6

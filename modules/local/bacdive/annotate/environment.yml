---
# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/environment-schema.json
# Image: docker.io/barbarahelena/osmotool:0.12.5. osmotool is not on conda: it is pip-installed from its git tag into this environment (tool versions as in 0.12.0: 0.12.5 changes only osmotool's own code)
channels:
  - conda-forge
  - bioconda
dependencies:
  - conda-forge::python=3.11.18
  - bioconda::diamond=2.2.9
  - bioconda::hmmer=3.4
  - bioconda::prodigal=2.6.3
  - bioconda::orfm=2.1.1
  - bioconda::bwa-mem3=0.18.0   # profile --catalog, build-catalog
  - conda-forge::numpy=2.4.6
  - conda-forge::pandas=3.1.1
  - conda-forge::xgboost=3.4.2   # annotate --predict_nacl
  - conda-forge::pip
  - pip:
      - git+https://github.com/barbarahelena/osmotool.git@v0.12.5

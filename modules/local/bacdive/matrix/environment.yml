---
# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/environment-schema.json
# Image: Seqera matplotlib_numpy_pandas_python_pruned. (exists). Pin statsmodels and xgboost to what the NaCl model was validated with
channels:
  - conda-forge
  - bioconda
dependencies:
  - conda-forge::python=3.11.0
  - conda-forge::pyyaml=6.0.3
  - conda-forge::numpy=2.4.6
  - conda-forge::pandas=3.0.3
  - conda-forge::scipy=1.17.1
  - conda-forge::scikit-learn=1.9.0
  - conda-forge::statsmodels
  - conda-forge::matplotlib=3.11.0
  - conda-forge::xgboost>=3.1
  - conda-forge::procps-ng=4.0.6

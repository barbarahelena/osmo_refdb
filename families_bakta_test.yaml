families:
- name: mscS
  description: "Small-conductance mechanosensitive channel (hypoosmotic downshock\
    \ protection). PF00924 is broader than PF01741/mscL: many bacteria carry several\
    \ divergent MscS-like paralogs (kefA, mscK, ynaI, ...) that aren't necessarily\
    \ functionally interchangeable with mscS itself, so treat this one with the same\
    \ caution as ectB \u2014 check the benchmark and cutoff_manifest.tsv status before\
    \ trusting it. Also includes mscS1/mscS2 (real, reviewed numbered-paralog gene\
    \ symbols, same class of gap as murB1/murB2 -- see issue #8).\n"
  positive_query: (gene:mscS OR gene:mscS1 OR gene:mscS2) AND taxonomy_id:2
  negative_query: xref:pfam-PF00924 NOT (gene:mscS OR gene:mscS1 OR gene:mscS2) AND
    taxonomy_id:2
  negative_pfam: PF00924
- name: mazG
  description: 'Nucleoside triphosphate pyrophosphohydrolase ("house-cleaning" enzyme,
    sanitizes non-canonical NTPs before they''re incorporated into DNA/RNA). Established
    literature ties mazG specifically to oxidative stress response (e.g. mycobacterial
    dormancy/antibiotic tolerance) more than osmotic stress -- included here on the
    basis of Culligan et al. 2012 (ISME J 6:1916-1925), which functionally demonstrated
    (transposon mutagenesis of a salt-tolerant gut metagenomic clone) that mazG is
    one of three genes (with galE and murB) required for that clone''s salt tolerance
    phenotype. Treat any mazG signal as suggestive of a general stress-response contribution
    rather than confirmed osmotic-stress-specific function. Also includes mazG1/mazG2
    (real, reviewed numbered-paralog gene symbols, same class of gap as murB1/murB2
    -- see issue #8).

    Negative-pool contamination here (64%, highest raw flag rate along with gshB)
    is the same structural pattern as mrpB/otsA/gshA/mscL, and profile_cascade.tsv''s
    HMM fallback doesn''t rescue it (no pfam_model, same reason as otsA/mrpC/gshA).
    DIAMOND precision (0.870) is borderline but kept in profile mode rather than scoped
    out, since this family''s own description already carries a biological-confidence
    caveat above -- a second, structural caveat on top would be redundant. See README''s
    "Structural negative-pool contamination" section.

    '
  positive_query: (gene:mazG OR gene:mazG1 OR gene:mazG2) AND taxonomy_id:2
  negative_query: xref:pfam-PF03819 NOT (gene:mazG OR gene:mazG1 OR gene:mazG2) AND
    taxonomy_id:2
  negative_pfam: PF03819
- name: trkA
  description: 'Regulatory/NAD-binding subunit of constitutive K+ uptake (Trk system;
    Task 1d, "Kdp backup/disambiguation" -- an alternative K+ uptake route to the
    inducible Kdp system already in this panel via kdpA, useful for telling "no Kdp
    signal" apart from "no K+ uptake capability at all"). Proteobacteria-type naming
    (E. coli TrkA).

    Kept as its own family, separate from ktrA below, the same way nhaA and mrpA-mrpG
    are two separate families for the same Na+/H+ antiporter function rather than
    one merged entry -- trkA/trkH (this entry + trkH below, Proteobacteria naming)
    and ktrA/ktrB/ktrD (Firmicutes naming, new entries below) are the same split pattern.
    IMPORTANT naming trap that motivated adding ktrA/ktrB/ktrD at all: the literal
    gene symbol "trkA" in Bacillota mostly does NOT refer to this system -- B. subtilis''s
    own "trkA" (UniProt O07085) is an unrelated CBS-domain protein (PF13738); the
    real Firmicutes-lineage ortholog of E. coli TrkA (matching PF02080+PF02254) is
    consistently named ktrA instead (confirmed via B. subtilis, B. licheniformis,
    and several Clostridium/Staphylococcus/Enterococcus UniProt entries) -- the same
    Proteobacteria-named-gene-assumed-universal pattern as nhaA. (The same bare-symbol
    trap showed up while researching opuB/opuC: neither resolves to the intended Bacillus-type
    transporter operon in UniProt, which is why this panel uses the real per-subunit
    symbols opuAB/opuBB/opuCB etc. instead -- see those entries above.) PF02080 (TrkA_N)
    rejected for pfam_model: a broad RCK-domain family, shared across many unrelated
    K+/Ca2+ channel regulatory subunits. Negative pool excludes both trkA and ktrA
    gene symbols even though they''re separate families, for the same reason proX/opuAC/opuBC/opuCC
    cross-exclude each other: ktrA is a real, distinct true positive elsewhere in
    this panel, not a clean negative for trkA. Also includes trkA1/trkA2 (some organisms,
    e.g. Azoarcus sp. BH72, Streptococcus thermophilus, carry two real, distinctly-named
    paralogs) -- confirmed via UniProt, the same numbered-paralog gap found for murB1/murB2
    and trkH1/ktrB1/ktrD1 below while investigating the class of bug mrpF/mrpG''s
    PhaF/yufB gap belongs to. Adding trkA1/trkA2 has a measured cost: of 372 UniProt
    trkA1/trkA2 entries, 82% (median 223aa) are short single-RCK-domain proteins already
    excluded by the length-outlier filter (canonical trkA median 457aa), but the 68
    that pass the filter are real, taxonomically scattered full-length orthologs (e.g.
    Halomonas, Cupriavidus, Roseobacter, Fusobacterium, Ruminococcus) whose diversity
    widens the DIAMOND reference cloud and measurably increases false positives on
    a held-out benchmark (6-family subset-test F1 0.920->0.879; confirmed in the full
    43-family v7 rebuild at 0.920->0.887, same regression, close to but not identical
    to the subset-test number -- see the "full 43-family v7 rebuild" notes on ectA/ktrA/mrpB/etc.
    for why full-panel and subset-test numbers for the same family don''t always match
    exactly). Kept anyway: these are real trkA genes a genuine read could come from,
    not an artifact, so this is a recall-vs-specificity trade-off structurally like
    the negative-pool findings below, not a bug to chase further.

    '
  positive_query: (gene:trkA OR gene:trkA1 OR gene:trkA2) AND taxonomy_id:2
  negative_query: xref:pfam-PF02080 NOT (gene:trkA OR gene:trkA1 OR gene:trkA2 OR
    gene:ktrA OR gene:ktrA1 OR gene:ktrA2) AND taxonomy_id:2
  negative_pfam: PF02080
- name: trkH
  description: 'Pore-forming subunit of the Trk system, paired with trkA above (Task
    1d). Proteobacteria-type naming (E. coli TrkH); see trkA''s entry above for why
    this is kept separate from ktrB/ktrD (Firmicutes naming, below) rather than merged
    as synonyms, matching the nhaA/mrp treatment. PF02386 ("TrkH") is shared by all
    three of trkH/ktrB/ktrD as real, distinct true positives in this panel -- the
    same situation as proX vs. opuAC/opuBC/opuCC, and NOT given pfam_model treatment
    for the same reason: adopting Pfam''s one model+cutoff for more than one of a
    same-Pfam-family sibling group makes their HMMs byte-identical, which isn''t just
    a specificity concern the way it is for proX/opuAC -- confirmed via the v6 benchmark
    that it''s a hard failure for HMM detection specifically. All three sibling HMMs
    score exactly the same on any given read (same underlying model), so hmmscan can''t
    tell them apart at all; 07_press_hmms.sh concatenates hmms/*.hmm in alphabetical
    order and 11_compute_metrics.py''s best_hit_per_read keeps the first tied hit,
    so whichever of the three sorts first alphabetically wins 100% of the shared signal
    and the other two get systematically zero HMM recall -- observed directly: trkH
    and ktrD both scored exactly 0 true positives in the v6 HMM benchmark, all of
    it absorbed by ktrB. DIAMOND is unaffected (it discriminates via each family''s
    own distinct reference sequences, not the shared profile) -- trkH/ktrB/ktrD all
    get real, distinct DIAMOND numbers. Kept as a custom, gene-symbol-anchored model
    instead, same as proX/opuAC/opuBC/opuCC. Also includes trkH1/trkH2 (some organisms,
    e.g. Edwardsiella tarda, Azoarcus sp. BH72, carry two real, distinctly-named paralogs)
    -- confirmed via UniProt, same numbered-paralog gap as murB1/murB2/trkA1/trkA2/ktrB1/ktrD1
    etc.

    Same structural negative-pool contamination as mrpB/otsA/etc. (see README''s "Structural
    negative-pool contamination" section): confirmed via v7''s negative_purity_manifest.tsv
    that the numbered-paralog fix above barely moved this family''s contamination
    (v6 27% flagged -> v7 29%), consistent with the pattern being real unlabeled orthologs,
    not a missing-symbol gap. decoy_from_negatives is not a fix either: Phase 4''s
    proX/opuAC/opuBC/opuCC experiment (see issue tracker / docs/CHANGELOG.md) showed
    this exact shared-Pfam-clique shape (trkH/ktrB/ktrD share PF02386 the same way
    proX/opuAC/opuBC/opuCC share PF04069) catastrophically backfires -- close paralogs
    outcompete a family''s own reference set once added back into the searchable pool
    as decoys. No pfam_model fallback is possible here either (removing pfam_model
    from all three was the fix for the byte-identical-HMM bug above), so both DIAMOND
    (0.293) and HMM (0.288) precision are low with no independent rescue via profile_cascade.tsv
    (hmm_status=overlapping_distributions_f1_calibrated, same contaminated pool).
    scope: annotate_only set, same criteria and treatment as otsA/mrpC: still built
    and searchable for osmotool annotate co-occurrence checks, excluded from osmotool
    profile''s reported output where this precision would be misleading.

    '
  positive_query: (gene:trkH OR gene:trkH1 OR gene:trkH2) AND taxonomy_id:2
  negative_query: xref:pfam-PF02386 NOT (gene:trkH OR gene:trkH1 OR gene:trkH2 OR
    gene:ktrB OR gene:ktrB1 OR gene:ktrB2 OR gene:ktrD OR gene:ktrD1 OR gene:ktrD2)
    AND taxonomy_id:2
  negative_pfam: PF02386
  scope: annotate_only
